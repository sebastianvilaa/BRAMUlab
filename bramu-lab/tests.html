<body>
<div id="summary">Corriendo tests…</div>
<h1>BRAMU Lab V12.1 — batería sintética de BRAMU Intelligence + Ajustar/Sacador/Tie break extraordinario</h1>
<div id="results"></div>

<script src="engine.js"></script>
<script src="stats.js"></script>
<script>
(function () {
  'use strict';
  const E = window.PLEngine;
  const S = window.PLStats;
  const results = [];

  function record(name, ok, detail) { results.push({ name, ok, detail: detail || '' }); }

  function assert(name, cond, detail) { record(name, !!cond, detail); }

  // ------------------------------------------------------------------
  // Fixtures y helpers de simulación (motor real, sin DOM)
  // ------------------------------------------------------------------
  function makePlayers() {
    return [
      { id: 0, name: 'Ana', team: 'A' }, { id: 1, name: 'Bea', team: 'A' },
      { id: 2, name: 'Cruz', team: 'B' }, { id: 3, name: 'Dan', team: 'B' },
    ];
  }

  function newCtx(scoringSystem, formatId, tiebreakMode) {
    return {
      players: makePlayers(),
      scoringSystem: scoringSystem || 'golden',
      format: E.FORMATS[formatId || 'classic'],
      tiebreakMode: tiebreakMode || 'classic',
      baseline: null,
      knowledge: E.createServerKnowledge(),
      state: E.createInitialEngineState(),
      events: [],
      ms: 0,
      seenSet: 0,
    };
  }

  function ensureServer(ctx) {
    const setNumber = ctx.state.sets.length + 1;
    if (setNumber === ctx.seenSet) return;
    const mgn = E.currentMatchGameNumber(ctx.state);
    const wsgn = E.currentWithinSetGameNumber(ctx.state);
    // `recordServerAnswer` solo completa el orden del EQUIPO al que pertenece el jugador
    // pasado — hace falta sembrar ambos equipos (game 1 y game 2 de este set) para que
    // `resolveServer` quede resuelto en TODOS los games del set, no solo los del primero
    // que sacó (si no, la mitad de los games quedan "unknown" y ningún break se detecta).
    const firstServer = setNumber % 2 === 1 ? 0 : 2; // alterna quién arranca sacando cada set
    const secondServer = firstServer === 0 ? 2 : 0;
    ctx.knowledge = E.recordServerAnswer(ctx.knowledge, ctx.players, setNumber, mgn, wsgn, firstServer);
    ctx.knowledge = E.recordServerAnswer(ctx.knowledge, ctx.players, setNumber, mgn + 1, wsgn + 1, secondServer);
    ctx.seenSet = setNumber;
  }

  function playPoint(ctx, team) {
    ensureServer(ctx);
    ctx.ms += 3000;
    ctx.events.push({ team, matchTimeMs: ctx.ms });
    ctx.state = E.applyPoint(ctx.state, team, ctx.scoringSystem, ctx.format, ctx.tiebreakMode);
  }

  /** Juega un game "limpio" (sin deuce) ganado en su totalidad por `team`. Con Punto de Oro
   *  4 puntos alcanzan siempre para cerrar el game sin ambigüedad. */
  function winGame(ctx, team) {
    for (let i = 0; i < 4; i++) playPoint(ctx, team);
  }

  /** Variante "cerrada" del game: el que pierde también suma 2 puntos (40-30 en vez de
   *  40-0), sin arriesgar deuce. Sirve para escenarios donde el resultado en GAMES debe
   *  quedar parejo sin que el total de PUNTOS quede artificialmente inflado a favor de
   *  quien barre todos los games limpios (eso dispara señales de "dominio" que no
   *  corresponden a la historia que el test quiere representar, ver §50). */
  function winGameClose(ctx, team) {
    const loser = team === 'A' ? 'B' : 'A';
    [team, loser, team, loser, team, team].forEach((t) => playPoint(ctx, t));
  }

  /** Juega un Tie break hasta un resultado EXACTO, sin disparar un cierre prematuro:
   *  primero empata punto a punto hasta `finalLoserPts` para ambos, después define. */
  function winTiebreak(ctx, winner, finalWinnerPts, finalLoserPts) {
    const loser = winner === 'A' ? 'B' : 'A';
    for (let i = 0; i < finalLoserPts; i++) { playPoint(ctx, loser); playPoint(ctx, winner); }
    for (let i = 0; i < (finalWinnerPts - finalLoserPts); i++) playPoint(ctx, winner);
  }

  function ctxAsMatchCtx(ctx) {
    return {
      players: ctx.players, scoringSystem: ctx.scoringSystem, format: ctx.format,
      tiebreakMode: ctx.tiebreakMode, serverKnowledge: ctx.knowledge, baseline: null, events: ctx.events,
    };
  }

  function intelFromSim(ctx) {
    const matchCtx = ctxAsMatchCtx(ctx);
    const stats = S.computeStats(ctx.events, matchCtx);
    const sets = ctx.state.sets;
    const winnerTeam = ctx.state.matchWinner;
    const text = S.generateBramuIntelligence(stats, matchCtx, sets, winnerTeam, null);
    return { stats, sets, winnerTeam, text };
  }

  const emptyOpp = () => ({ opportunities: 0, converted: 0, saved: 0 });
  function makeStats(overrides) {
    return Object.assign({
      totalPoints: 0, pointsA: 0, pointsB: 0,
      goldenPoints: { played: 0, wonA: 0, wonB: 0 }, starPoints: { played: 0, wonA: 0, wonB: 0 },
      hasServerInfo: false, serverFullyKnown: false,
      serviceGames: { wonA: 0, wonB: 0, lostA: 0, lostB: 0, unknown: 0 },
      serveStats: { A: { served: 0, wonServing: 0 }, B: { served: 0, wonServing: 0 } },
      breaks: { A: 0, B: 0 },
      breakPoints: emptyOpp2(), setPoints: emptyOpp2(), matchPoints: emptyOpp2(),
      perPlayerServe: {}, maxStreak: { A: 0, B: 0 }, leadChanges: 0, setDurations: [],
      matchDurationMs: 0, hasAdjustments: false, finalState: null,
    }, overrides);
  }
  function emptyOpp2() { return { A: emptyOpp(), B: emptyOpp() }; }
  function makeMatchCtx(overrides) {
    return Object.assign({
      players: makePlayers(), scoringSystem: 'golden', format: E.FORMATS.classic, tiebreakMode: 'classic',
      baseline: null, events: [],
    }, overrides);
  }

  // ------------------------------------------------------------------
  // UNIT TESTS — funciones puras (§16/45.1, §53-57)
  // ------------------------------------------------------------------
  (function () {
    assert('U1 · magnitud 7 vs 6 → "apenas"', S.describeMagnitude(7, 6) === 'apenas', S.describeMagnitude(7, 6));
    assert('U2 · magnitud 9 vs 3 → "clara"', S.describeMagnitude(9, 3) === 'clara', S.describeMagnitude(9, 3));
    assert('U3 · magnitud 16 vs 2 → "mucha"', S.describeMagnitude(16, 2) === 'mucha', S.describeMagnitude(16, 2));
    assert('U4 · magnitud 16 vs 0 → "enorme"', S.describeMagnitude(16, 0) === 'enorme', S.describeMagnitude(16, 0));
    assert('U5 · magnitud 5 vs 5 → sin diferencia (null)', S.describeMagnitude(5, 5) === null, S.describeMagnitude(5, 5));
    assert('U6 · frase 7 vs 6 → "apenas una más"', S.magnitudeOpportunitiesPhrase(7, 6) === 'apenas una más', S.magnitudeOpportunitiesPhrase(7, 6));
    assert('U7 · frase 16 vs 2 → "muchas más oportunidades"', S.magnitudeOpportunitiesPhrase(16, 2) === 'muchas más oportunidades', S.magnitudeOpportunitiesPhrase(16, 2));

    const nameOf = (t) => (t === 'A' ? 'Ana y Bea' : 'Cruz y Dan');
    const otherName = (t) => (t === 'A' ? 'Cruz y Dan' : 'Ana y Bea');

    // §54 — EFICIENCIA: A consigue más quiebres (3 vs 2), B es más eficiente. Prohibido
    // "A aprovechó mejor sus oportunidades".
    const t54 = S.interpretBreakPointsNarrative({ opportunities: 9, converted: 3, saved: 0 }, { opportunities: 3, converted: 2, saved: 0 }, nameOf, otherName);
    assert('U8 · §54 eficiencia: A más quiebres, B más eficiente', t54 && t54.includes('más eficiente') && t54.includes('Cruz y Dan'), t54);
    assert('U9 · §54 eficiencia: frase prohibida ausente', !t54 || !t54.includes('aprovechó mejor sus oportunidades'), t54);

    // §57 — 0/0: A 2/5, B 0/0. Prohibido "0 de 0" y comparar eficiencia de B.
    const t57 = S.interpretBreakPointsNarrative({ opportunities: 5, converted: 2, saved: 0 }, { opportunities: 0, converted: 0, saved: 0 }, nameOf, otherName);
    assert('U10 · §57 0/0: no dispuso de oportunidad', t57 && t57.includes('no llegaron a disponer'), t57);
    assert('U11 · §57 0/0: nunca "0 de 0"', !t57 || !t57.includes('0 de 0'), t57);

    // Orientación de marcador (§27): B ganó el set real A-B 4-6 → en prosa debe leerse "6-4".
    assert('U12 · orientScore hacia el protagonista', S.orientScore(4, 6, 'B') === '6-4', S.orientScore(4, 6, 'B'));
  })();

  // ------------------------------------------------------------------
  // TESTS DE INTEGRACIÓN — motor real (engine.js) → stats.js → Intelligence
  // ------------------------------------------------------------------
  (function () {
    // §47 — DOMINIO TOTAL 6-0 · 6-0
    const ctx1 = newCtx('golden', 'classic');
    for (let s = 0; s < 2; s++) for (let g = 0; g < 6; g++) winGame(ctx1, 'A');
    const r1 = intelFromSim(ctx1);
    assert('F1 · §47 dominio total: menciona dominio', /domin/i.test(r1.text), r1.text);
    assert('F1b · §47 dominio total: nunca "parejo"', !/parejo/i.test(r1.text), r1.text);

    // §48 — 6-0 / 6-1
    const ctx2 = newCtx('golden', 'classic');
    winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A');
    winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'A'); winGame(ctx2, 'B'); winGame(ctx2, 'A');
    const r2 = intelFromSim(ctx2);
    assert('F2 · §48 6-0/6-1: "de principio a fin"', /principio a fin/i.test(r2.text), r2.text);

    // §50 — MISMO 6-3, HISTORIA B: 1-1→2-2→3-3→4-3→quiebre→6-3 (parejo hasta el quiebre
    // tardío). Con el saque arrancando en A y alternando por game, este guion produce
    // EXACTAMENTE un quiebre en el game 8 — el mismo caso del ejemplo del consolidado.
    // americano (1 solo set) para que el partido quede REALMENTE terminado con winnerTeam
    // definido — con 'classic' (mejor de 3) un único set 6-3 deja el partido a mitad de
    // camino y varias historias que dependen de winnerTeam ni siquiera se evalúan.
    const ctx3 = newCtx('golden', 'americano');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGameClose(ctx3, t));
    const r3 = intelFromSim(ctx3);
    assert('F3 · §50 parejo + quiebre tardío: menciona paridad', /parejo/i.test(r3.text), r3.text);
    assert('F3b · §50 parejo + quiebre tardío: nunca "de principio a fin"', !/principio a fin/i.test(r3.text), r3.text);
    assert('F3c · §50 exactamente 1 quiebre en la simulación', (r3.stats.breaks.A + r3.stats.breaks.B) === 1, JSON.stringify(r3.stats.breaks));

    // §52 — SIN BREAKS + TIE BREAK (Americano, TB en 5-5): 10 games alternados donde cada
    // uno sostiene su propio saque (0 quiebres), define el Tie break.
    const ctx4 = newCtx('golden', 'americano');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctx4, t));
    winTiebreak(ctx4, 'A', 7, 5);
    const r4 = intelFromSim(ctx4);
    assert('F4 · §52 TB decisivo: 0 quiebres en la simulación', (r4.stats.breaks.A + r4.stats.breaks.B) === 0, JSON.stringify(r4.stats.breaks));
    assert('F4b · §52 TB decisivo: menciona el Tie break', /tie break/i.test(r4.text), r4.text);
    assert('F4c · §52 TB decisivo: nunca "dominaron"', !/domin/i.test(r4.text), r4.text);

    // §53 — PRESIÓN SIN CONVERSIÓN (fixture directo): A 0/15 BP, B 1/1 BP.
    const stats53 = makeStats({
      hasServerInfo: true, serverFullyKnown: true,
      totalPoints: 40, pointsA: 15, pointsB: 25,
      breakPoints: { A: { opportunities: 15, converted: 0, saved: 0 }, B: { opportunities: 1, converted: 1, saved: 0 } },
    });
    const sets53 = [{ gamesA: 4, gamesB: 6, winner: 'B', tiebreak: null }];
    const text53 = S.generateBramuIntelligence(stats53, makeMatchCtx(), sets53, 'B', null);
    assert('F5 · §53 presión sin conversión: menciona oportunidades', /oportunidad/i.test(text53), text53);
    assert('F5b · §53 presión sin conversión: nunca "0 de 0"', !text53.includes('0 de 0'), text53);
    assert('F5c · §53 presión sin conversión: no lo llama dominio de A', !/Ana y Bea domin/i.test(text53), text53);

    // §27/45.4 — ORIENTACIÓN DE MARCADOR sin ganador de partido todavía (partido parcial):
    // set real A-B 4-6, ganado por B → la prosa debe decir "6-4", nunca "4-6".
    const statsPartial = makeStats({ totalPoints: 0 });
    const setsPartial = [{ gamesA: 4, gamesB: 6, winner: 'B', tiebreak: null }];
    const textPartial = S.generateBramuIntelligence(statsPartial, makeMatchCtx(), setsPartial, null, null);
    assert('F6 · orientación de marcador (sin ganador): "6-4" presente', textPartial.includes('6-4'), textPartial);
    assert('F6b · orientación de marcador (sin ganador): "4-6" ausente', !textPartial.includes('4-6'), textPartial);
  })();

  // ------------------------------------------------------------------
  // V11 — UNIT TESTS: Break Points (§2.1/§2.2/§7.9/§8)
  // ------------------------------------------------------------------
  (function () {
    const nameOf = (t) => (t === 'A' ? 'Ana y Bea' : 'Cruz y Dan');
    const otherName = (t) => (t === 'A' ? 'Cruz y Dan' : 'Ana y Bea');

    // §2.1 — BUG GRAVE: 0/3 vs 0/5 (ambos convierten 0). Prohibido "más contundente" y
    // "consiguió/consiguieron 0 quiebres" como si fuera un logro.
    const t1 = S.interpretBreakPointsNarrative({ opportunities: 3, converted: 0, saved: 3 }, { opportunities: 5, converted: 0, saved: 5 }, nameOf, otherName);
    assert('U13 · §2.1 BP 0/3 vs 0/5: nunca "0 quiebres" como contundencia', !/consiguier\w* 0 quiebre/i.test(t1) && !/más contundente/i.test(t1), t1);
    assert('U13b · §2.1 BP 0/3 vs 0/5: menciona oportunidades, no eficiencia', /oportunidad/i.test(t1), t1);

    // §2.2 — misma eficiencia con distinta cantidad de oportunidades: 3/9 (33%) vs 2/6 (33%).
    // Prohibido "aprovechó/aprovecharon mejor" — la tasa es idéntica.
    const t2 = S.interpretBreakPointsNarrative({ opportunities: 9, converted: 3, saved: 6 }, { opportunities: 6, converted: 2, saved: 4 }, nameOf, otherName);
    assert('U14 · §2.2 eficiencia igual (3/9 vs 2/6): nunca "aprovechó mejor"', !/aprovech\w* mejor/i.test(t2), t2);
    assert('U14b · §2.2 eficiencia igual: menciona los quiebres (3 y 2)', t2.includes('3') && t2.includes('2'), t2);

    // §7.9 — presión sin conversión: A generó 15 oportunidades y no convirtió ninguna: B tuvo
    // 1 sola oportunidad y la convirtió. No confundir con dominio de A (quien más generó).
    const t3 = S.interpretBreakPointsNarrative({ opportunities: 15, converted: 0, saved: 15 }, { opportunities: 1, converted: 1, saved: 0 }, nameOf, otherName);
    assert('U15 · §7.9 presión sin conversión: menciona oportunidades y conversión', /oportunidad/i.test(t3) && /convert/i.test(t3), t3);

    // §2.3 — concordancia gramatical: sujeto de dos jugadores siempre en plural. Barre TODAS
    // las ramas de interpretBreakPointsNarrative con verbos en singular pegados al nombre.
    const casosGramatica = [
      S.interpretBreakPointsNarrative({ opportunities: 5, converted: 2, saved: 3 }, { opportunities: 0, converted: 0, saved: 0 }, nameOf, otherName),
      S.interpretBreakPointsNarrative({ opportunities: 5, converted: 5, saved: 0 }, { opportunities: 0, converted: 0, saved: 0 }, nameOf, otherName),
      S.interpretBreakPointsNarrative({ opportunities: 5, converted: 2, saved: 3 }, { opportunities: 3, converted: 2, saved: 1 }, nameOf, otherName),
      t1, t2, t3,
      S.interpretBreakPointsNarrative({ opportunities: 9, converted: 3, saved: 6 }, { opportunities: 3, converted: 2, saved: 1 }, nameOf, otherName),
      S.interpretBreakPointsNarrative({ opportunities: 9, converted: 3, saved: 6 }, { opportunities: 6, converted: 1, saved: 5 }, nameOf, otherName),
    ];
    const singularBug = /(Ana y Bea|Cruz y Dan)\}?\s*(consiguió|generó|convirtió|aprovechó|necesitó|fue)\b/i;
    casosGramatica.forEach((t, i) => {
      if (t) assert(`U16.${i} · §2.3 concordancia plural (sin verbo singular)`, !singularBug.test(t), t);
    });
  })();

  // ------------------------------------------------------------------
  // V11 — INTEGRACIÓN: Narrative Planner (§3.1/§3.4), orientación (§2.4/§20.20),
  // redundancia (§2.5), Match Points (§20.9), Tie break en saque/resto (§12/§20.16-19)
  // ------------------------------------------------------------------
  (function () {
    /** Arma un game donde `leaderTeam` llega a tener Match/Set Point `saves` veces seguidas
     *  (todas salvadas por el rival) y termina GANÁNDOLO el rival. Necesita scoringSystem
     *  'classic' (Con Ventaja) para poder salvar de a uno real en vez de un solo Punto de
     *  Oro/Star Point que decide el game de una. Nota: el propio camino a deuce (0-0→40-40)
     *  ya pasa una vez por 40-30 a favor de `leaderTeam` — un game point real que también
     *  cuenta como salvado — así que el bucle explícito de abajo solo necesita `saves - 1`
     *  vueltas adicionales para totalizar exactamente `saves`. */
    function playGameSavedByOpponent(ctx, leaderTeam, saves) {
      const opp = leaderTeam === 'A' ? 'B' : 'A';
      for (let i = 0; i < 3; i++) { playPoint(ctx, leaderTeam); playPoint(ctx, opp); } // 0-0 → 40-40
      for (let i = 0; i < saves - 1; i++) { playPoint(ctx, leaderTeam); playPoint(ctx, opp); } // deuce↔ventaja
      playPoint(ctx, opp); playPoint(ctx, opp); // el rival gana: ventaja + game
    }

    // ---- F7 · CASO PATRÓN §3.4: Set1 6-3 (A) · Set2 6-7 TB (B, con 3 MP de A salvados en
    //      el Set 2) · Set3 6-2 (B) — el mismo desarrollo del ejemplo del consolidado. ----
    const ctx7 = newCtx('classic', 'classic'); // "Con Ventaja" + Clásico (mejor de 3 sets)
    // Set 1: A se lo lleva 6-3.
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGame(ctx7, t));
    // Set 2: A llega a 5-1 (6 games)...
    ['A', 'A', 'A', 'B', 'A', 'A'].forEach((t) => winGame(ctx7, t));
    // ...B salva 3 Match Points de A en el 7° game y se lo termina llevando (5-2)...
    playGameSavedByOpponent(ctx7, 'A', 3);
    // ...B empareja a 5-5 (3 games más), A vuelve a 6-5, B fuerza el 6-6 y gana el Tie break.
    ['B', 'B', 'B', 'A', 'B'].forEach((t) => winGame(ctx7, t));
    winTiebreak(ctx7, 'B', 7, 5);
    // Set 3: B gana 6-2 — un desarrollo totalmente distinto al Set 2, no puede omitirse.
    ['A', 'B', 'A', 'B', 'B', 'B', 'B', 'B'].forEach((t) => winGame(ctx7, t));
    const r7 = intelFromSim(ctx7);
    assert('F7 · §3.4 caso patrón: B gana el partido', r7.winnerTeam === 'B', r7.winnerTeam);
    assert('F7b · §3.4 caso patrón: 3 sets jugados', r7.sets.length === 3, r7.sets.length);
    assert('F7c · V11.14 no omite el primer set (apertura)', r7.text.includes('primer set') && r7.text.includes('6-3'), r7.text);
    assert('F7d · V11.14 dedica su propio párrafo al segundo set (composición cronológica)', r7.text.includes('segundo set'), r7.text);
    assert('F7e · V11.14 marcador del peor momento (1-5 abajo) sobrevive en el párrafo del Set 2', r7.text.includes('1-5'), r7.text);
    assert('F7f · V11.14 los 3 Match Points salvados quedan en el relato', r7.text.includes('3 Match Points'), r7.text);
    assert('F7g · V11.14 menciona el Tie break del Set 2, orientado hacia quien ganó (7-5)', r7.text.includes('Tie break') && r7.text.includes('7-5'), r7.text);
    assert('F7h · V11.14 no omite el desenlace del set decisivo (Set 3, 6-2)', r7.text.includes('set decisivo') && r7.text.includes('6-2'), r7.text);
    assert('F7i · V11.14 orden cronológico: el primer set nunca aparece después del set decisivo', r7.text.indexOf('6-3') < r7.text.indexOf('set decisivo'), r7.text);
    assert('F7j · §3.2 profundidad: al menos 3 párrafos para un partido rico', r7.text.split('\n\n').length >= 3, r7.text);

    // ---- F8 · §2.4/§20.20: remontada SIN Tie break — regresión puntual del bug real
    //      "ganarlo 6-7" narrando al equipo que en realidad ganó 7-6 (acá, 4-6). Americano
    //      dispara Tie break si el set pasa por 5-5 (a diferencia de Clásico, en 6-6) — el
    //      guion evita ese empate exacto para poder aislar la orientación sin Tie break. ----
    const ctx8 = newCtx('golden', 'americano'); // 1 solo set, alcanza para aislar la orientación
    ['B', 'A', 'A', 'A', 'A'].forEach((t) => winGame(ctx8, t)); // B 1 - A 4 (déficit de B: 3)
    ['B', 'B', 'B', 'B', 'B'].forEach((t) => winGame(ctx8, t)); // B remonta y cierra 6-4, sin pasar por 5-5
    const r8 = intelFromSim(ctx8);
    assert('F8 · §2.4 orientación de marcador en remontada sin TB: "6-4" presente', r8.text.includes('6-4'), r8.text);
    assert('F8b · §2.4 orientación de marcador: "4-6" ausente (bug real: score crudo sin orientar)', !r8.text.includes('4-6'), r8.text);
    assert('F8c · §3.1 remontada en el único set: no agrega un acto de cierre espurio', !r8.text.includes('otro desarrollo'), r8.text);

    // ---- F4d/e/f/g/h · mismo fixture que F4 (§52, TB decisivo sin quiebres: 10 games
    //      alternados sin quiebres + Tie break 7-5) para las regresiones de §2.5
    //      (redundancia) y §12 (Tie break en saque/resto). Reconstruido acá porque F4 vive
    //      en el IIFE anterior (fuera de este scope). ----------------------------------------
    const ctx4b = newCtx('golden', 'americano');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctx4b, t));

  // ------------------------------------------------------------------
  // V11.1 — hold bajo presión (§4.3) y variedad de lenguaje (§11.3)
  // ------------------------------------------------------------------
  (function () {
    /** Mismo helper que en el bloque anterior (reescrito acá porque cada IIFE tiene su
     *  propio scope): arma un game donde `leaderTeam` llega a tener Break/Match/Set Point
     *  `saves` veces seguidas (todas salvadas por el rival) y termina GANÁNDOLO el rival.
     *  Usada acá con `leaderTeam` = el equipo que RESTA, para que el rival (el que SACA)
     *  sea quien sostiene el servicio salvando Break Points — el "hold bajo presión". */
    function playGameSavedByOpponent(ctx, leaderTeam, saves) {
      const opp = leaderTeam === 'A' ? 'B' : 'A';
      for (let i = 0; i < 3; i++) { playPoint(ctx, leaderTeam); playPoint(ctx, opp); }
      for (let i = 0; i < saves - 1; i++) { playPoint(ctx, leaderTeam); playPoint(ctx, opp); }
      playPoint(ctx, opp); playPoint(ctx, opp);
    }

    // ---- U17 · §4.3 findDramaticHold: detecta el hold que salvó 3 Break Points -----------
    const ctxH = newCtx('classic', 'americano'); // Con Ventaja, 1 set alcanza para aislarlo
    playGameSavedByOpponent(ctxH, 'B', 3); // B resta, A saca y sostiene salvando 3 BP
    for (let i = 0; i < 5; i++) winGame(ctxH, 'A'); // A cierra el set con holds limpios después
    const dh = S.findDramaticHold(ctxH.events, ctxAsMatchCtx(ctxH));
    assert('U17 · §4.3 hold bajo presión: detecta al equipo correcto (A)', dh && dh.team === 'A', JSON.stringify(dh));
    assert('U17b · §4.3 hold bajo presión: cuenta exactamente 3 Break Points salvados', dh && dh.bpSaved === 3, JSON.stringify(dh));
    assert('U17c · §4.3 hold bajo presión: set correcto', dh && dh.setNumber === 1, JSON.stringify(dh));

    // ---- U18 · §4.3 sin hold dramático: ningún game con 2+ BP salvados → null -----------
    const ctxH2 = newCtx('classic', 'americano');
    for (let i = 0; i < 4; i++) winGame(ctxH2, 'A');
    for (let i = 0; i < 2; i++) winGame(ctxH2, 'B');
    const dh2 = S.findDramaticHold(ctxH2.events, ctxAsMatchCtx(ctxH2));
    assert('U18 · §4.3 sin holds bajo presión (todo limpio): null', dh2 === null, JSON.stringify(dh2));

    // ---- F10 · §4.3 integrado: aparece en el texto de BRAMU Intelligence -----------------
    const ctxH3 = newCtx('classic', 'americano');
    playGameSavedByOpponent(ctxH3, 'B', 3);
    for (let i = 0; i < 5; i++) winGame(ctxH3, 'A');
    const r10 = intelFromSim(ctxH3);
    assert('F10 · §4.3 el relato menciona el hold bajo presión (3 Break Points seguidos)', r10.text.includes('3 Break Points seguidos'), r10.text);
    assert('F10b · §4.3 nunca infiere psicología (nervios/carácter) en esta frase', !/nervio|carácter|fortaleza mental/i.test(r10.text), r10.text);

    // ---- U19 · §11.3 variedad de lenguaje: elección determinística ------------------------
    const seedX = S.varietySeedFor({ totalPoints: 40, matchDurationMs: 120000 }, [{}, {}]);
    const seedY = S.varietySeedFor({ totalPoints: 40, matchDurationMs: 120000 }, [{}, {}]);
    assert('U19 · §11.3 misma entrada → misma semilla (determinístico)', seedX === seedY, `${seedX} vs ${seedY}`);
    assert('U19b · §11.3 pickPhrase devuelve una variante real del banco', S.PHRASE_BANKS.inicio.includes(S.pickPhrase('inicio', seedX)), S.pickPhrase('inicio', seedX));
    assert('U19c · §11.3 misma semilla → misma variante siempre', S.pickPhrase('cierre', 7) === S.pickPhrase('cierre', 7), '');

    // ---- F11 · §11.3 dos partidos con desarrollos distintos → distinta variante ----------
    // (No es un requisito absoluto — solo confirma que el mecanismo realmente varía y no
    // quedó siempre fijo en el primer elemento del banco por algún error de cómputo.)
    const ctx11a = newCtx('golden', 'classic');
    ['A', 'A', 'B', 'A', 'A'].forEach((t) => winGameClose(ctx11a, t));
    for (let i = 0; i < 2; i++) winGame(ctx11a, 'B');
    const r11a = intelFromSim(ctx11a);
    const ctx11b = newCtx('golden', 'classic');
    ['A', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGameClose(ctx11b, t));
    winGame(ctx11b, 'B'); winGame(ctx11b, 'B'); winGame(ctx11b, 'B');
    const r11b = intelFromSim(ctx11b);
    assert('F11 · §11.3 dos partidos con distinta duración/puntaje: alguna variante difiere o el texto difiere', r11a.text !== r11b.text, `${r11a.text}\n---\n${r11b.text}`);
  })();

    ['B', 'A', 'B', 'A', 'B', 'B'].forEach((t) => playPoint(ctx, t));

    assert('F12-setup · puntos totales extremadamente parejos', Math.abs(stats.pointsA - stats.pointsB) <= 1, `${stats.pointsA}-${stats.pointsB}`);

    const r12 = intelFromSim(ctx);
    // 1) indica que no hubo breaks
    assert('F12.1 · indica que nadie quebró el servicio', /nadie quebr/i.test(r12.text), r12.text);
    // 2) reconoce la fuerte paridad previa (evidencia real, no solo "terminó ajustado")

    assert('F12.3 · identifica el Tie break como definición', /Tie break/i.test(r12.text), r12.text);

    // 6) no inventa dominio durante todo el partido

  // V11.14 — CASO REAL: partido Clásico completo a tres sets (Seba/Matu vs
  // Gusti/Esteban, Punto de Oro), 6-4 · 6-3 · 6-4. Reproduce el caso reportado por
  // Sebastián: BRAMU debe narrar los TRES sets en orden cronológico (nunca un hold del
  // Set 1 apareciendo después del cierre del Set 3), identificar el Punto de Oro + quiebre
  // de 4-4 del set decisivo como la verdadera bisagra, y NO mencionar la eficiencia
  // agregada de Break Points del equipo perdedor (correcta pero irrelevante para explicar
  // el resultado).
  // ------------------------------------------------------------------
  (function () {
    const ctx = newCtx('golden', 'classic');
    ctx.players = [
      { id: 0, name: 'Seba', team: 'A' }, { id: 1, name: 'Matu', team: 'A' },
      { id: 2, name: 'Gusti', team: 'B' }, { id: 3, name: 'Esteban', team: 'B' },
    ];

    // ---- SET 1 (6-4, Seba/Matu) — incluye un hold bajo presión de Gusti/Esteban en el
    //      game 4 (sacando el equipo B), que debe quedar narrado DENTRO del párrafo del
    //      Set 1 — nunca después del cierre del Set 3 (el bug real reportado). ----
    winGame(ctx, 'A'); // game1
    winGame(ctx, 'B'); // game2
    winGame(ctx, 'A'); // game3
    ['A', 'A', 'A', 'B', 'B', 'B', 'B'].forEach((t) => playPoint(ctx, t)); // game4: B (saca) salva BP de A y sostiene
    winGame(ctx, 'A'); // game5
    winGame(ctx, 'B'); // game6
    winGame(ctx, 'A'); // game7
    winGame(ctx, 'B'); // game8
    winGame(ctx, 'A'); // game9
    winGame(ctx, 'A'); // game10 — 6-4 Seba/Matu

    // ---- SET 2 (6-3, Gusti/Esteban) — reacción y toma de control, fuerza el tercero. ----
    winGame(ctx, 'B'); winGame(ctx, 'A'); winGame(ctx, 'B'); winGame(ctx, 'A');
    winGame(ctx, 'B'); winGame(ctx, 'A'); winGame(ctx, 'B'); winGame(ctx, 'B'); winGame(ctx, 'B'); // 6-3 B

    // ---- SET 3 (6-4, Seba/Matu) — sin quiebres hasta 4-4; después, Punto de Oro sobre el
    //      saque rival produce el quiebre para 5-4, y Seba/Matu sostienen su saque para
    //      cerrar 6-4. El servidor del Set 3 se setea a mano (arranca sacando el equipo B)
    //      para que el game decisivo (9°) quede servido por B — con la alternancia por
    //      defecto del arnés (siempre arranca sacando el equipo A en sets impares) el game 9
    //      quedaría servido por A, y el punto decisivo sería un hold, no un quiebre. ----
    const mgn3 = E.currentMatchGameNumber(ctx.state);
    const wsgn3 = E.currentWithinSetGameNumber(ctx.state);
    ctx.knowledge = E.recordServerAnswer(ctx.knowledge, ctx.players, 3, mgn3, wsgn3, 2);
    ctx.knowledge = E.recordServerAnswer(ctx.knowledge, ctx.players, 3, mgn3 + 1, wsgn3 + 1, 0);
    ctx.seenSet = 3;
    winGame(ctx, 'B'); winGame(ctx, 'A'); winGame(ctx, 'B'); winGame(ctx, 'A'); // 2-2
    winGame(ctx, 'B'); winGame(ctx, 'A'); winGame(ctx, 'B'); winGame(ctx, 'A'); // 4-4, sin quiebres
    ['B', 'A', 'B', 'A', 'B', 'A', 'A'].forEach((t) => playPoint(ctx, t)); // game9: A gana el Punto de Oro sobre el saque de B → 5-4
    winGame(ctx, 'A'); // game10: A sostiene su saque → 6-4, cierra el partido

    const matchCtx = ctxAsMatchCtx(ctx);
    const dh = S.findDramaticHold(ctx.events, matchCtx);
    const r13 = intelFromSim(ctx);
    const text = r13.text;

    assert('F13-setup · partido 6-4 · 6-3 · 6-4, Seba/Matu ganan en 3 sets', r13.winnerTeam === 'A' && r13.sets.length === 3, JSON.stringify({ winnerTeam: r13.winnerTeam, sets: r13.sets }));
    assert('F13-setup · el Set 3 termina 6-4', r13.sets[2].gamesA === 6 && r13.sets[2].gamesB === 4, JSON.stringify(r13.sets[2]));
    assert('F13-setup · hay un hold bajo presión real en el Set 1', !!dh && dh.setNumber === 1 && dh.bpSaved >= 2, JSON.stringify(dh));

    // 1) cubre el Set 1
    assert('F13.1 · cubre el Set 1 (primer set, 6-4)', text.includes('primer set') && text.includes('6-4'), text);
    // 2) cubre el cambio de desarrollo del Set 2
    assert('F13.2 · cubre el Set 2 (segundo set, 6-3, reacción)', text.includes('segundo set') && text.includes('6-3'), text);
    // 3) cubre el Set 3 como set decisivo
    assert('F13.3 · cubre el Set 3 como set decisivo', text.includes('set decisivo'), text);
    // 4) identifica el Punto de Oro + quiebre de 4-4 como momento decisivo
    assert('F13.4 · identifica el Punto de Oro sobre el saque rival como la jugada decisiva', text.includes('4-4') && text.includes('Punto de Oro') && text.includes('sobre el saque rival') && text.includes('5-4'), text);
    // 5) mantiene la cronología: primer set → segundo set → set decisivo, en ese orden
    assert('F13.5 · mantiene el orden cronológico (Set 1 antes que Set 2 antes que el set decisivo)', text.indexOf('primer set') < text.indexOf('segundo set') && text.indexOf('segundo set') < text.indexOf('set decisivo'), text);
    // 6) no pone un hecho del Set 1 después del cierre del Set 3 — el hold bajo presión debe
    //    quedar ANTES del párrafo del Set 2 (nunca después del cierre del set decisivo).
    const holdPhrase = dh ? `${dh.bpSaved} Break Points seguidos` : '';
    assert('F13.6 · el hold bajo presión del Set 1 aparece antes del párrafo del Set 2 (nunca después del cierre)', !!dh && text.includes(holdPhrase) && text.indexOf(holdPhrase) < text.indexOf('segundo set'), text);
    // 7) no introduce comparaciones estadísticas irrelevantes (eficiencia de Break Points del
    //    equipo perdedor, correcta pero irrelevante para explicar el resultado — bug real).
    assert('F13.7 · nunca "más eficientes" (comparación de eficiencia de Break Points suprimida)', !/más eficientes/i.test(text), text);
    assert('F13.7b · nunca "necesitaron menos oportunidades" (misma comparación suprimida)', !/necesitaron menos oportunidades/i.test(text), text);
    // 8) permite evidencia global útil si realmente aporta (párrafo 4 opcional, nunca relleno)
    const paraCount = text.split('\n\n').length;
    assert('F13.8 · entre 3 y 4 párrafos (el 4° es opcional, nunca relleno forzado)', paraCount === 3 || paraCount === 4, text);
    // 9) no inventa psicología ni hechos no registrados
    assert('F13.9 · nunca infiere psicología (nervios/carácter/presión mental)', !/nervio|carácter|presión mental/i.test(text), text);
  })();

    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A'].forEach((t) => winGame(ctxB, t)); // 5-4 Seba/Matu (game 10 lo saca Gusti)
    ['A', 'A', 'A', 'B', 'B', 'B', 'B'].forEach((t) => playPoint(ctxB, t)); // 0-40 + Oro: Gusti/Esteban salvan 4 MP y sostienen -> 5-5
    ['A', 'A', 'A', 'B', 'B', 'B', 'B', 'B', 'B', 'B'].forEach((t) => playPoint(ctxB, t)); // TB: 3-0 Seba/Matu, después 7 seguidos de Gusti/Esteban -> 7-3
    const rB = intelFromSim(ctxB);

    assert('TESTB-setup · partido definido por Tie break, Gusti/Esteban ganan 6-5', rB.winnerTeam === 'B' && rB.sets.length === 1 && rB.sets[0].tiebreak && rB.sets[0].gamesA === 5 && rB.sets[0].gamesB === 6, JSON.stringify(rB.sets));
    assert('TESTB-setup · 0 quiebres en todo el partido (el hold bajo presión no es un quiebre)', rB.stats.breaks.A === 0 && rB.stats.breaks.B === 0, JSON.stringify(rB.stats.breaks));
    // 1) MP salvados narrados ANTES del desarrollo del TB, y 2) el hold del 5-5 también antes
    const mpIdx = rB.text.indexOf('Match Point');
    const tbArcIdx = rB.text.search(/3 abajo|remontaron|separaron temprano/i);
    assert('TESTB.1 · menciona los Match Points salvados por Seba y Matu', mpIdx !== -1, rB.text);
    assert('TESTB.2 · los Match Points salvados aparecen ANTES del desarrollo interno del Tie break', mpIdx !== -1 && tbArcIdx !== -1 && mpIdx < tbArcIdx, rB.text);
    assert('TESTB.2b · usa la variante seleccionada para hold bajo presión', /sostener el servicio|sacar adelante su servicio/.test(rB.text), rB.text);
    // 3) desarrollo interno del TB (arranque 3-0 de Seba/Matu, reacción de Gusti/Esteban)
    assert('TESTB.3 · cuenta el desarrollo interno del Tie break (arranque 3-0)', tbArcIdx !== -1, rB.text);
    // 4) no repetir "cerrar/cerrarlo" en exceso
    const cerrarCount = (rB.text.match(/cerr[aoó]/gi) || []).length;
    assert('TESTB.4 · no repite "cerrar/cerrarlo" en exceso (máximo 2 menciones)', cerrarCount <= 2, rB.text);
    // 5) sujeto correcto: el hold del 5-5 lo protagonizan Gusti y Esteban, el TB también
    assert('TESTB.5 · sujeto explícito al narrar quién salvó los Match Points (Gusti y Esteban)', rB.text.includes('Gusti y Esteban salvaron'), rB.text);
  })();

  // ------------------------------------------------------------------
  // V12 (§15) — CASOS A-E: AJUSTAR nunca fabrica lo que no se sabe (BP/rachas/secuencias
  // sobre el tramo salteado), pero conserva el delta de puntos ganados cuando el ajuste
  // queda dentro del mismo game y avanza. Todos usan el mecanismo real (`E.applyAdjustment`
  // + `S.computeStats`), igual que lo hace `saveAdjustment` en app.js.
  // ------------------------------------------------------------------
  (function () {
    // ---- CASO A · Punto de Oro: 15-0 → AJUSTAR → 40-30 -----------------------------------
    const ctxA = newCtx('golden', 'classic');
    playPoint(ctxA, 'A'); // 15-0 (1 punto real de A)
    const newStateA = Object.assign({}, ctxA.state, { pointsA: 3, pointsB: 2 }); // 40-30
    ctxA.events.push({ type: 'adjustment', newState: newStateA, timestamp: new Date().toISOString(), matchTimeMs: ctxA.ms + 1000, scoreBeforeLabel: '15-0', scoreAfterLabel: '40-30' });
    const statsA = S.computeStats(ctxA.events, ctxAsMatchCtx(ctxA));
    const stateA = E.computeStateFromEvents(ctxA.events, 'golden', E.FORMATS.classic, 'classic', null);
    assert('CASO A · score correcto tras AJUSTAR (40-30)', stateA.pointsA === 3 && stateA.pointsB === 2, JSON.stringify({ pointsA: stateA.pointsA, pointsB: stateA.pointsB }));
    assert('CASO A · conserva el delta de puntos ganados (dato seguro, §3.2)', statsA.pointsA === 3 && statsA.pointsB === 2, JSON.stringify({ pointsA: statsA.pointsA, pointsB: statsA.pointsB }));
    assert('CASO A · no fabrica Break Points en el tramo salteado', statsA.breakPoints.A.opportunities === 0 && statsA.breakPoints.B.opportunities === 0, JSON.stringify(statsA.breakPoints));
    assert('CASO A · no fabrica racha más allá de lo realmente jugado (solo 1 punto real de A)', statsA.maxStreak.A === 1 && statsA.maxStreak.B === 0, JSON.stringify(statsA.maxStreak));
    assert('CASO A · marca hasAdjustments (datos parciales, §3.3)', statsA.hasAdjustments === true, statsA.hasAdjustments);

    // ---- CASO B · Punto de Oro: AJUSTAR directo a 40-40 → debe entrar en PUNTO DE ORO ----
    const ctxB = newCtx('golden', 'classic');
    const newStateB = Object.assign({}, ctxB.state, { pointsA: 3, pointsB: 3 });
    const stateB = E.applyAdjustment(newStateB);
    const dispB = E.formatPointsDisplay(stateB.pointsA, stateB.pointsB, 'golden');
    assert('CASO B · AJUSTAR directo a 40-40 activa Punto de Oro sin acción adicional', dispB.isGoldenPoint === true && /PUNTO DE ORO/.test(dispB.centralLabel), JSON.stringify(dispB));

    // ---- CASO C · Con Ventaja: ajustar a DEUCE / VENTAJA A / VENTAJA B ------------------
    const baseC = newCtx('classic', 'classic').state;
    const dispDeuce = E.formatPointsDisplay(E.applyAdjustment(Object.assign({}, baseC, { pointsA: 3, pointsB: 3 })).pointsA, 3, 'classic');
    assert('CASO C · ajustar a DEUCE', dispDeuce.centralLabel === 'DEUCE', JSON.stringify(dispDeuce));
    const stateVentajaA = E.applyAdjustment(Object.assign({}, baseC, { pointsA: 4, pointsB: 3 }));
    const dispVentajaA = E.formatPointsDisplay(stateVentajaA.pointsA, stateVentajaA.pointsB, 'classic');
    assert('CASO C · ajustar a VENTAJA Equipo A', dispVentajaA.aText === 'VENTAJA' && dispVentajaA.bText === '40', JSON.stringify(dispVentajaA));
    const stateVentajaB = E.applyAdjustment(Object.assign({}, baseC, { pointsA: 3, pointsB: 4 }));
    const dispVentajaB = E.formatPointsDisplay(stateVentajaB.pointsA, stateVentajaB.pointsB, 'classic');
    assert('CASO C · ajustar a VENTAJA Equipo B', dispVentajaB.bText === 'VENTAJA' && dispVentajaB.aText === '40', JSON.stringify(dispVentajaB));

    // ---- CASO D · Star Point: ajustar a los 7 estados especiales (DEUCE 1/1ª VENTAJA/
    //      DEUCE 2/2ª VENTAJA/STAR POINT) — misma lógica real del motor, sin estados
    //      paralelos (usa exactamente enumerateValidGameStates, igual que la UI). --------
    const starStates = E.enumerateValidGameStates('starpoint').filter((st) => st.pointsA >= 3 && st.pointsB >= 3);
    assert('CASO D · Star Point expone los 7 estados especiales', starStates.length === 7, JSON.stringify(starStates));
    const starLabels = starStates.map((st) => st.label);
    ['Deuce 1', '1ª ventaja Equipo A', '1ª ventaja Equipo B', 'Deuce 2', '2ª ventaja Equipo A', '2ª ventaja Equipo B', 'Star Point'].forEach((label) => {
      assert(`CASO D · incluye el estado "${label}"`, starLabels.includes(label), starLabels.join(', '));
    });
    const starPointState = starStates.find((st) => st.label === 'Star Point');
    const dispStar = E.formatPointsDisplay(starPointState.pointsA, starPointState.pointsB, 'starpoint');
    assert('CASO D · el estado "Star Point" activa isStarPoint', dispStar.isStarPoint === true, JSON.stringify(dispStar));
    const deuce2State = starStates.find((st) => st.label === 'Deuce 2');
    const dispDeuce2 = E.formatPointsDisplay(deuce2State.pointsA, deuce2State.pointsB, 'starpoint');
    assert('CASO D · el estado "Deuce 2" se distingue de Deuce 1 (nunca combinaciones 40-40+N)', dispDeuce2.centralLabel === 'DEUCE 2', JSON.stringify(dispDeuce2));

    // ---- CASO E · Dos ajustes manuales dentro del mismo game: no fabrica secuencias -----
    const ctxE = newCtx('golden', 'classic');
    playPoint(ctxE, 'A'); // 15-0 (1 punto real)
    const newState1 = Object.assign({}, ctxE.state, { pointsA: 2, pointsB: 1 }); // 30-15
    ctxE.events.push({ type: 'adjustment', newState: newState1, matchTimeMs: ctxE.ms + 1000 });
    const stateAfter1 = E.applyAdjustment(newState1);
    const newState2 = Object.assign({}, stateAfter1, { pointsA: 3, pointsB: 2 }); // 40-30
    ctxE.events.push({ type: 'adjustment', newState: newState2, matchTimeMs: ctxE.ms + 2000 });
    const statsE = S.computeStats(ctxE.events, ctxAsMatchCtx(ctxE));
    assert('CASO E · dos ajustes seguidos conservan el delta total de puntos', statsE.pointsA === 3 && statsE.pointsB === 2, JSON.stringify({ pointsA: statsE.pointsA, pointsB: statsE.pointsB }));
    assert('CASO E · ningún ajuste fabrica racha entre ellos (solo el punto real cuenta)', statsE.maxStreak.A === 1 && statsE.maxStreak.B === 0, JSON.stringify(statsE.maxStreak));
    assert('CASO E · ningún ajuste fabrica Break Points entre ellos', statsE.breakPoints.A.opportunities === 0 && statsE.breakPoints.B.opportunities === 0, JSON.stringify(statsE.breakPoints));
  })();

  // ------------------------------------------------------------------
  // V12 (§16) — CASOS F-H: corrección de sacador (snapshot congelado) y auditoría
  // equipo/individual. `recordServerCorrection`/dispatcher de `resolveServer` viven en
  // engine.js; el fix de conflación equipo/individual vive en 4 sitios de stats.js.
  // ------------------------------------------------------------------
  (function () {
    // ---- CASO F · corregir sacador ANTES del primer punto del game --------------------
    const ctxF = newCtx('golden', 'americano');
    ctxF.knowledge = E.recordServerAnswer(ctxF.knowledge, ctxF.players, 1, 1, 1, 0); // game1: Ana (id0, A)
    ctxF.knowledge = E.recordServerAnswer(ctxF.knowledge, ctxF.players, 1, 2, 2, 2); // game2: Cruz (id2, B)
    ctxF.seenSet = 1;
    winGame(ctxF, 'A'); // game 1 completo, sin ambigüedad
    const mgnF2 = E.currentMatchGameNumber(ctxF.state);
    const wsgnF2 = E.currentWithinSetGameNumber(ctxF.state);
    // Se corrige ANTES de jugar ningún punto del game 2: en realidad saca Dan (id3), no Cruz.
    ctxF.knowledge = E.recordServerCorrection(ctxF.knowledge, ctxF.players, 1, mgnF2, wsgnF2, 3);
    const resolvedF1 = E.resolveServer(ctxF.knowledge, ctxF.players, 1, 1, 1);
    const resolvedF2 = E.resolveServer(ctxF.knowledge, ctxF.players, 1, mgnF2, wsgnF2);
    assert('CASO F · corrección antes del 1er punto: el game corregido resuelve al jugador correcto (Dan)', resolvedF2.resolved && resolvedF2.playerId === 3, JSON.stringify(resolvedF2));
    assert('CASO F · corrección antes del 1er punto: el game anterior (game 1) queda intacto (Ana)', resolvedF1.resolved && resolvedF1.playerId === 0, JSON.stringify(resolvedF1));

    // ---- CASO G · corregir sacador DESPUÉS de varios puntos ya jugados ------------------
    // Reasignación correcta, estadísticas individuales/de equipo, y rotación futura.
    const ctxG = newCtx('golden', 'americano');
    ctxG.knowledge = E.recordServerAnswer(ctxG.knowledge, ctxG.players, 1, 1, 1, 0); // game1: se anotó Ana (id0) — ERROR real
    ctxG.knowledge = E.recordServerAnswer(ctxG.knowledge, ctxG.players, 1, 2, 2, 2); // game2: Cruz (id2, B)
    ctxG.seenSet = 1;
    playPoint(ctxG, 'B'); playPoint(ctxG, 'B'); // 0-30, ya con 2 puntos registrados (atribuidos a Ana, mal)
    const mgnG1 = E.currentMatchGameNumber(ctxG.state); // 1 (mismo game)
    const wsgnG1 = E.currentWithinSetGameNumber(ctxG.state); // 1
    // En realidad estaba sacando Bea (id1), no Ana — se corrige a mitad de game.
    ctxG.knowledge = E.recordServerCorrection(ctxG.knowledge, ctxG.players, 1, mgnG1, wsgnG1, 1);
    playPoint(ctxG, 'B'); playPoint(ctxG, 'B'); // B cierra el game (0-40): quiebre sobre el saque corregido (Bea/A)
    const statsG = S.computeStats(ctxG.events, ctxAsMatchCtx(ctxG));
    assert('CASO G · reasignación correcta: el quiebre se atribuye al equipo A (Bea), no queda huérfano', statsG.breaks.A === 0 && statsG.breaks.B === 1, JSON.stringify(statsG.breaks));
    assert('CASO G · estadísticas individuales: Bea (corregida) carga el game completo, incluidos los puntos previos a la corrección', statsG.perPlayerServe[1].games === 1 && statsG.perPlayerServe[1].held === 0, JSON.stringify(statsG.perPlayerServe[1]));
    assert('CASO G · estadísticas individuales: Ana (la corrección la reemplaza) no carga ningún game', statsG.perPlayerServe[0].games === 0, JSON.stringify(statsG.perPlayerServe[0]));
    const resolvedG3 = E.resolveServer(ctxG.knowledge, ctxG.players, 1, 3, 3); // próximo game de A tras la corrección
    assert('CASO G · rotación futura recalculada a partir del sacador corregido (Ana rota al lugar de Bea)', resolvedG3.resolved && resolvedG3.playerId === 0, JSON.stringify(resolvedG3));

    // ---- CASO H · sacador individual desconocido, EQUIPO al servicio conocido ----------
    // No deben descartarse las métricas de equipo (§6) aunque el jugador nunca se resuelva.
    const playersH = makePlayers();
    const formatH = E.FORMATS.americano;
    let stateH = E.createInitialEngineState();
    const eventsH = [];
    let msH = 0;
    function playH(team) { msH += 3000; eventsH.push({ team, matchTimeMs: msH }); stateH = E.applyPoint(stateH, team, 'golden', formatH, 'classic'); }
    for (let i = 0; i < 4; i++) playH('A'); // game1: A sirve (paridad) y sostiene — sin quiebre
    for (let i = 0; i < 4; i++) playH('A'); // game2: B sirve (paridad) y A gana igual — quiebre a favor de A
    const knowledgeH = { parity: { oddTeam: 'A' }, perSet: {} }; // paridad conocida, orden por set NUNCA registrado
    const matchCtxH = { players: playersH, scoringSystem: 'golden', format: formatH, tiebreakMode: 'classic', serverKnowledge: knowledgeH, baseline: null, events: eventsH };
    const statsH = S.computeStats(eventsH, matchCtxH);
    assert('CASO H · breaks de equipo se conservan aunque el jugador individual nunca se resuelva', statsH.breaks.A === 1 && statsH.breaks.B === 0, JSON.stringify(statsH.breaks));
    assert('CASO H · serviceGames de equipo se conservan (no caen en "unknown")', (statsH.serviceGames.wonA + statsH.serviceGames.lostA + statsH.serviceGames.wonB + statsH.serviceGames.lostB) === 2 && statsH.serviceGames.unknown === 0, JSON.stringify(statsH.serviceGames));
    assert('CASO H · serveStats de equipo se conservan', statsH.serveStats.A.served > 0 && statsH.serveStats.B.served > 0, JSON.stringify(statsH.serveStats));
    assert('CASO H · no se fabrican métricas de jugador individual (quedan en su default)', Object.values(statsH.perPlayerServe).every((p) => p.games === 0), JSON.stringify(statsH.perPlayerServe));
    assert('CASO H · serverFullyKnown queda false (el jugador individual nunca se conoció)', statsH.serverFullyKnown === false, statsH.serverFullyKnown);
  })();

  // ------------------------------------------------------------------
  // V12 (§17) — CASOS I-M: Tie break extraordinario, motor puro (engine.js). Reusa
  // `startExtraordinaryTiebreak`/`isValidExtraordinaryTargetChange` + el mecanismo de
  // ajuste (`applyAdjustment`) exactamente como lo hará app.js — nunca fabrica games.
  // ------------------------------------------------------------------
  (function () {
    // ---- CASO I · 5-5, game nuevo 0-0, RESOLVER CON TIE BREAK -----------------------
    const ctxI = newCtx('golden', 'classic');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxI, t)); // 5-5, sin breaks
    assert('CASO I-setup · llega a 5-5 real, sin quiebres', ctxI.state.gamesA === 5 && ctxI.state.gamesB === 5, JSON.stringify({ a: ctxI.state.gamesA, b: ctxI.state.gamesB }));
    const canStartI = E.canStartExtraordinaryTiebreak(ctxI.state);
    assert('CASO I · puede arrancar el TB extraordinario (game nuevo en 0-0)', canStartI === true, canStartI);
    const newStateI = E.startExtraordinaryTiebreak(ctxI.state, 10, true);
    assert('CASO I · el score real (5-5) NO se fabrica hacia 6-6 al arrancar', newStateI.gamesA === 5 && newStateI.gamesB === 5, JSON.stringify(newStateI));
    assert('CASO I · no se suma hold ni break al arrancar (setsWonA/B intactos)', newStateI.setsWonA === 0 && newStateI.setsWonB === 0 && newStateI.sets.length === 0, JSON.stringify(newStateI));
    assert('CASO I · arranca el TB correctamente (0-0, activo, objetivo 10 · diferencia de 2)', newStateI.inTiebreak === true && newStateI.tbA === 0 && newStateI.tbB === 0 && newStateI.extraordinaryTiebreak.active === true && newStateI.extraordinaryTiebreak.winTarget === 10 && newStateI.extraordinaryTiebreak.requireDiff2 === true, JSON.stringify(newStateI.extraordinaryTiebreak));
    ctxI.events.push({ type: 'adjustment', newState: newStateI, matchTimeMs: ctxI.ms + 1000 });
    ctxI.state = newStateI;
    for (let i = 0; i < 8; i++) playPoint(ctxI, 'A'); // A gana el TB extraordinario 10-0 (>=10, diff2 OK)
    // (nota: los primeros 8 puntos no cierran nada — solo el 10° si acumula 10; ver abajo)
    for (let i = 0; i < 2; i++) playPoint(ctxI, 'A');
    assert('CASO I · el TB extraordinario cierra el set con el score REAL 5-5 (nunca 6-6/7-6)', ctxI.state.sets.length === 1 && ctxI.state.sets[0].gamesA === 5 && ctxI.state.sets[0].gamesB === 5 && ctxI.state.sets[0].extraordinary === true, JSON.stringify(ctxI.state.sets));
    assert('CASO I · el resultado del TB queda guardado (10-0)', ctxI.state.sets[0].tiebreak.a === 10 && ctxI.state.sets[0].tiebreak.b === 0, JSON.stringify(ctxI.state.sets[0].tiebreak));

    // ---- CASO J · 4-3, Otro → a 10 → diferencia de 2 --------------------------------
    const ctxJ = newCtx('golden', 'americano');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A'].forEach((t) => winGame(ctxJ, t)); // 4-3 A
    const newStateJ = E.startExtraordinaryTiebreak(ctxJ.state, 10, true);
    ctxJ.events.push({ type: 'adjustment', newState: newStateJ, matchTimeMs: ctxJ.ms + 1000 });
    ctxJ.state = newStateJ;
    for (let i = 0; i < 8; i++) playPoint(ctxJ, 'B');
    for (let i = 0; i < 2; i++) playPoint(ctxJ, 'B'); // B gana el TB 10-0
    assert('CASO J · resultado final "4-3 · TB" sin fabricar games (el ganador del TB define el set)', ctxJ.state.sets[0].gamesA === 4 && ctxJ.state.sets[0].gamesB === 3 && ctxJ.state.sets[0].winner === 'B', JSON.stringify(ctxJ.state.sets[0]));

    // ---- CASO K · TB a 10, cambiar en vivo a 15: preserva puntos/servicio/timeline ---
    const ctxK = newCtx('golden', 'americano');
    ['A', 'A', 'A', 'A', 'A'].forEach((t) => winGame(ctxK, t)); // 5-0
    const newStateK = E.startExtraordinaryTiebreak(ctxK.state, 10, true);
    ctxK.events.push({ type: 'adjustment', newState: newStateK, matchTimeMs: ctxK.ms + 1000 });
    ctxK.state = newStateK;
    for (let i = 0; i < 8; i++) playPoint(ctxK, 'A'); // 8-0, todavía no llegó a 10
    const eventsCountBeforeChange = ctxK.events.length;
    assert('CASO K · permite subir el objetivo (8 < 15)', E.isValidExtraordinaryTargetChange(ctxK.state.tbA, ctxK.state.tbB, 15) === true, JSON.stringify({ tbA: ctxK.state.tbA, tbB: ctxK.state.tbB }));
    const newStateK2 = Object.assign({}, ctxK.state, { extraordinaryTiebreak: Object.assign({}, ctxK.state.extraordinaryTiebreak, { winTarget: 15 }) });
    ctxK.events.push({ type: 'adjustment', newState: newStateK2, matchTimeMs: ctxK.ms + 2000 });
    ctxK.state = E.applyAdjustment(newStateK2);
    for (let i = 0; i < 2; i++) playPoint(ctxK, 'A'); // 10-0: con el viejo objetivo (10) ya habría cerrado
    assert('CASO K · el TB NO cierra en 10-0 tras subir el objetivo a 15 (preserva lo jugado, no lo repite)', ctxK.state.inTiebreak === true && ctxK.state.tbA === 10, JSON.stringify(ctxK.state));
    assert('CASO K · conserva todos los eventos reales (puntos + los 2 ajustes, sin reescribir nada)', ctxK.events.length === eventsCountBeforeChange + 1 + 2, ctxK.events.length);
    for (let i = 0; i < 5; i++) playPoint(ctxK, 'A'); // 15-0: ahora sí cierra con el nuevo objetivo
    assert('CASO K · cierra correctamente con el nuevo objetivo (15)', ctxK.state.sets.length === 1 && ctxK.state.sets[0].tiebreak.a === 15, JSON.stringify(ctxK.state.sets));

    // ---- CASO L · van 8-4, intentar bajar el objetivo a 7: debe impedirse -----------
    assert('CASO L · bajar el objetivo a un valor ya superado (7, con 8-4) se rechaza', E.isValidExtraordinaryTargetChange(8, 4, 7) === false, '');
    assert('CASO L · bajar exactamente al score actual (8, con 8-4) también se rechaza', E.isValidExtraordinaryTargetChange(8, 4, 8) === false, '');
    assert('CASO L · subir a cualquier valor por encima del score actual (12, con 8-4) se permite', E.isValidExtraordinaryTargetChange(8, 4, 12) === true, '');

    // ---- CASO M · elegir sacador al comenzar el TB extraordinario: rotación posterior ----
    // Formato 'classic' (TB normal recién a 6-6): así 5-5 queda como game nuevo en 0-0, sin
    // disparar de paso un Tie break REGLAMENTARIO (que sí pasaría con 'americano', tbAt=5).
    const ctxM = newCtx('golden', 'classic');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxM, t)); // 5-5
    const newStateM = E.startExtraordinaryTiebreak(ctxM.state, 10, true);
    // Se pregunta "¿quién comienza sacando?" — se elige a Cruz (id2, equipo B), reusando el
    // mismo mecanismo de Casos F-H (congela lo anterior, reancla la rotación desde acá).
    ctxM.knowledge = E.recordServerCorrection(ctxM.knowledge, ctxM.players, 1, newStateM.tbBaseGameNumber, newStateM.tbBaseWithinSet, 2);
    const firstServerM = E.resolveTiebreakServer(ctxM.knowledge, ctxM.players, 1, newStateM.tbBaseGameNumber, newStateM.tbBaseWithinSet, 0);
    assert('CASO M · el TB extraordinario arranca sacando el jugador elegido (Cruz)', firstServerM.resolved && firstServerM.playerId === 2, JSON.stringify(firstServerM));
    // Puntos 2-3 del TB le tocan al otro equipo (rotación real de dobles); el equipo de
    // Cruz vuelve a sacar recién en el punto 5 (índice 4) — ahí le toca a su compañero Dan.
    const fifthServerM = E.resolveTiebreakServer(ctxM.knowledge, ctxM.players, 1, newStateM.tbBaseGameNumber, newStateM.tbBaseWithinSet, 4);
    assert('CASO M · la rotación del TB continúa correctamente desde el sacador elegido (compañero, 2do turno del equipo)', fifthServerM.resolved && fifthServerM.playerId === 3, JSON.stringify(fifthServerM));
  })();

  // ------------------------------------------------------------------
  // V12 (§17) — CASO N: Tie break extraordinario que define el PARTIDO. BRAMU Intelligence
  // debe narrar el contexto real (5-5 previo) sin inventar 6-6/7-6, y no marcar el partido
  // como "datos parciales" (§14.2: es una transición conocida, no una ambigüedad).
  // ------------------------------------------------------------------
  (function () {
    const ctxN = newCtx('golden', 'classic');
    for (let i = 0; i < 6; i++) winGame(ctxN, 'A'); // Set 1: 6-0 A
    for (let i = 0; i < 6; i++) winGame(ctxN, 'B'); // Set 2: 6-0 B
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxN, t)); // Set 3: 5-5
    const newStateN = E.startExtraordinaryTiebreak(ctxN.state, 10, true);
    ctxN.events.push({ type: 'adjustment', newState: newStateN, matchTimeMs: ctxN.ms + 1000 });
    ctxN.state = newStateN;
    for (let i = 0; i < 6; i++) { playPoint(ctxN, 'B'); playPoint(ctxN, 'A'); } // 6-6
    for (let i = 0; i < 4; i++) playPoint(ctxN, 'B'); // 10-6: B gana el TB y el partido

    assert('CASO N-setup · B gana el partido en 3 sets, el 3° resuelto por TB extraordinario', ctxN.state.matchWinner === 'B' && ctxN.state.sets.length === 3 && ctxN.state.sets[2].extraordinary === true, JSON.stringify(ctxN.state.sets));
    assert('CASO N-setup · el set 3 guarda el score real 5-5 (nunca fabricado a 6-6/7-6)', ctxN.state.sets[2].gamesA === 5 && ctxN.state.sets[2].gamesB === 5, JSON.stringify(ctxN.state.sets[2]));

    const rN = intelFromSim(ctxN);
    assert('CASO N · BRAMU Intelligence menciona el Tie break de la resolución extraordinaria', /Tie break/i.test(rN.text), rN.text);
    assert('CASO N · describe el contexto real (5-5) antes del TB, sin inventar 6-6/7-6', rN.text.includes('5-5') && !/\b6-6\b/.test(rN.text) && !/\b7-6\b/.test(rN.text), rN.text);
    assert('CASO N · menciona el resultado real del Tie break (10-6)', rN.text.includes('10-6'), rN.text);
    assert('CASO N · no marca el partido como "datos parciales" por resolver con TB extraordinario', rN.stats.hasAdjustments === false, rN.stats.hasAdjustments);
  })();

  // ------------------------------------------------------------------
  // V12.1 (§8-9) — "RESOLVER CON TIE BREAK" ahora termina el PARTIDO siempre, sin importar
  // cuántos sets ganó cada uno hasta ese momento (cambio de semántica respecto a V12, donde
  // solo decidía el set y el partido podía seguir). Caso crítico obligatorio + regresiones.
  // ------------------------------------------------------------------
  (function () {
    // ---- CASO CRÍTICO (§8): Set1 6-3 (A), Set2 llega a 4-4, Otro → a 10 → diferencia de
    //      2, B gana el TB 10-8. El partido debe terminar YA, sin tercer set. ----------
    const ctxCrit = newCtx('golden', 'classic');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGame(ctxCrit, t)); // Set1 6-3 A
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxCrit, t)); // Set2 4-4
    const newStateCrit = E.startExtraordinaryTiebreak(ctxCrit.state, 10, true);
    ctxCrit.events.push({ type: 'adjustment', newState: newStateCrit, matchTimeMs: ctxCrit.ms + 1000 });
    ctxCrit.state = newStateCrit;
    for (let i = 0; i < 8; i++) { playPoint(ctxCrit, 'B'); playPoint(ctxCrit, 'A'); } // 8-8
    for (let i = 0; i < 2; i++) playPoint(ctxCrit, 'B'); // 10-8, B gana el TB y el partido

    assert('CRÍTICO · el partido termina inmediatamente (matchWinner seteado)', ctxCrit.state.matchWinner === 'B', ctxCrit.state.matchWinner);
    assert('CRÍTICO · NO aparece un tercer set (solo 2 segmentos: Set1 + TB decisivo)', ctxCrit.state.sets.length === 2, JSON.stringify(ctxCrit.state.sets));
    assert('CRÍTICO · el score regular permanece intacto: Set1 6-3, Set2 4-4 (nunca 5-4/6-4/7-6)', ctxCrit.state.sets[0].gamesA === 6 && ctxCrit.state.sets[0].gamesB === 3 && ctxCrit.state.sets[1].gamesA === 4 && ctxCrit.state.sets[1].gamesB === 4, JSON.stringify(ctxCrit.state.sets));
    assert('CRÍTICO · el segundo segmento queda marcado como extraordinario, con el TB 10-8 (B)', ctxCrit.state.sets[1].extraordinary === true && ctxCrit.state.sets[1].tiebreak.b === 10 && ctxCrit.state.sets[1].tiebreak.a === 8, JSON.stringify(ctxCrit.state.sets[1]));
    assert('CRÍTICO · ganador del partido: quien ganó el TB (B)', ctxCrit.state.setsWonB >= 1 && ctxCrit.state.matchWinner === 'B', JSON.stringify({ setsWonA: ctxCrit.state.setsWonA, setsWonB: ctxCrit.state.setsWonB }));
    // No preguntar nuevo sacador / no continuar: cualquier intento de seguir jugando no debe
    // alterar el estado (guard ya existente en applyPoint, `if (s.matchWinner) return s;`).
    const afterAttempt = E.applyPoint(ctxCrit.state, 'A', 'golden', E.FORMATS.classic, 'classic');
    assert('CRÍTICO · no admite más juego una vez terminado (intentar sumar un punto no cambia nada)', JSON.stringify(afterAttempt) === JSON.stringify(ctxCrit.state), 'el estado cambió tras intentar jugar con el partido ya terminado');

    const rCrit = intelFromSim(ctxCrit);
    assert('CRÍTICO · BRAMU Intelligence dice que se resolvió el PARTIDO (no "el set")', rCrit.text.includes('resolver el partido'), rCrit.text);
    assert('CRÍTICO · menciona el score real 4-4 antes del TB, sin inventar 5-4/6-4/7-6', rCrit.text.includes('4-4') && !/\b5-4\b/.test(rCrit.text) && !/\b6-4\b/.test(rCrit.text) && !/\b7-6\b/.test(rCrit.text), rCrit.text);
    assert('CRÍTICO · nunca dice "empatado" ni "tercer set"', !/empatad/i.test(rCrit.text) && !/tercer set/i.test(rCrit.text), rCrit.text);

    // ---- CASO A (§9): mismo escenario, pero gana el TB el Equipo A ---------------------
    const ctxA = newCtx('golden', 'classic');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGame(ctxA, t)); // Set1 6-3 A
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxA, t)); // Set2 4-4
    const newStateA9 = E.startExtraordinaryTiebreak(ctxA.state, 10, true);
    ctxA.events.push({ type: 'adjustment', newState: newStateA9, matchTimeMs: ctxA.ms + 1000 });
    ctxA.state = newStateA9;
    for (let i = 0; i < 8; i++) { playPoint(ctxA, 'A'); playPoint(ctxA, 'B'); } // 8-8
    for (let i = 0; i < 2; i++) playPoint(ctxA, 'A'); // 10-8, A gana
    assert('CASO A (§9) · termina inmediatamente con Equipo A como ganador', ctxA.state.matchWinner === 'A' && ctxA.state.sets.length === 2, JSON.stringify({ winner: ctxA.state.matchWinner, sets: ctxA.state.sets.length }));

    // ---- CASO B (§9): Tie break REGLAMENTARIO a 6-6 se comporta exactamente como antes --
    const ctxB9 = newCtx('golden', 'classic');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B'].forEach((t) => winGame(ctxB9, t)); // 6-6, dispara TB normal
    assert('CASO B (§9) · un TB a 6-6 arranca solo, sin extraordinaryTiebreak activo', ctxB9.state.inTiebreak === true && (!ctxB9.state.extraordinaryTiebreak || !ctxB9.state.extraordinaryTiebreak.active), JSON.stringify(ctxB9.state.extraordinaryTiebreak));
    winTiebreak(ctxB9, 'A', 7, 5);
    assert('CASO B (§9) · el set se guarda normal (no extraordinario) y el partido sigue si hace falta', ctxB9.state.sets[0].extraordinary === undefined && ctxB9.state.sets[0].gamesA === 7 && ctxB9.state.sets[0].gamesB === 6, JSON.stringify(ctxB9.state.sets[0]));
    assert('CASO B (§9) · un solo set ganado (Clásico, mejor de 3) no termina el partido', ctxB9.state.matchWinner === null, ctxB9.state.matchWinner);
  })();

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------
  const passCount = results.filter((r) => r.ok).length;
  const failCount = results.length - passCount;
  document.getElementById('summary').innerHTML =
    `${passCount}/${results.length} tests OK` + (failCount ? ` — <span class="bad">${failCount} FALLARON</span>` : ' — <span class="ok">todo verde</span>');
  document.getElementById('results').innerHTML = results.map((r) => `
    <div class="case ${r.ok ? 'pass' : 'fail'}">
      <div class="case__title">${r.ok ? '✅' : '❌'} ${r.name}</div>
      ${r.detail ? `<div class="case__detail">${String(r.detail).replace(/</g, '&lt;')}</div>` : ''}
    </div>
  `).join('');
})();
</script>
</body>
</html>
