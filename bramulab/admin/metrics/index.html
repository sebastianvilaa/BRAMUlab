<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#050A12">
  <meta name="color-scheme" content="dark">
  <title>BRAMU Metrics</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <!-- BRAMU Metrics V1 · F3 — consola PRIVADA. Página estática SIN datos: todo sale de la Edge Function `admin-metrics`,
       que autoriza al administrador en servidor. No es una PWA (sin manifest, sin Service Worker propio: el SW de la app
       deja pasar /admin/ directo a la red) y no se indexa (meta + X-Robots-Tag + robots). Rutas absolutas a propósito:
       /admin/metrics y /admin/metrics/ sirven el mismo documento. -->
  <link rel="stylesheet" href="/admin/metrics/metrics.css">
</head>
<body>
  <div id="mx-env" class="mx-env" role="status" hidden></div>
  <header class="mx-top">
    <a class="mx-brand" href="/admin/metrics/" aria-label="BRAMU Metrics — Inicio">
      <img src="/icons/logo.svg" alt="BRAMUlab" height="18">
      <span class="mx-brand__tag">METRICS</span>
    </a>
    <div class="mx-top__right">
      <span id="mx-updated" class="mx-updated" aria-live="polite"></span>
      <button id="mx-refresh" class="mx-icon-btn" type="button" aria-label="Actualizar datos" title="Actualizar datos" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="mx-main" id="mx-main">
    <section id="mx-gate" class="mx-gate" hidden></section>

    <div id="mx-app" hidden>
      <div class="mx-controls">
        <div class="mx-seg" id="mx-range" role="group" aria-label="Período"></div>
        <div class="mx-toggles">
          <label class="mx-switch"><input type="checkbox" id="mx-compare" checked><span class="mx-switch__ui" aria-hidden="true"></span><span class="mx-switch__txt">Comparar con período anterior</span></label>
          <label class="mx-switch"><input type="checkbox" id="mx-internal"><span class="mx-switch__ui" aria-hidden="true"></span><span class="mx-switch__txt">Incluir cuentas internas</span></label>
        </div>
      </div>
      <p id="mx-window" class="mx-window"></p>
      <nav class="mx-tabs" id="mx-tabs" aria-label="Secciones"></nav>
      <div id="mx-view" class="mx-view" aria-live="polite" aria-busy="false"></div>
    </div>
  </main>

  <div id="mx-tip" class="mx-tip" role="presentation" hidden></div>

  <noscript><p class="mx-noscript">BRAMU Metrics necesita JavaScript.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="/env.generated.js"></script>
  <script src="/admin/metrics/metrics.js"></script>
</body>
</html>
