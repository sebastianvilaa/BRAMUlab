  // ==================================================================
  // V13.4 (§1-13/§19/§21) — SISTEMA DE PUNTUACIÓN EN VIVO, REEMPLAZA el modelo V13.3 de
  // "regla por punto" (`ev.scoringSystem`). Ahora `match.scoringSystem` es una propiedad
  // ÚNICA del partido: la corrección solo es segura mientras siga siendo compatible con el
  // game en curso, y se bloquea para siempre en cuanto cierra el primer game sensible.
  // ==================================================================

  // V13.4-A (§11, test crítico del Consolidado) — imposible crear un partido híbrido: una
  // vez que un game de deuce cerró bajo Star Point, no hay vuelta atrás a Punto de Oro/Ventaja.
  (function () {
    const fmt = E.FORMATS.classic;
    const events = [];
    // Arranca con Punto de Oro, juega games normales SIN llegar a 40-40 (no hay divergencia
    // posible antes de la zona de deuce — §4): 4-0 para A.
    ['A', 'A', 'A', 'A'].forEach((t, i) => events.push({ team: t, matchTimeMs: i * 100 }));
    let state = E.computeStateFromEvents(events, 'golden', fmt, 'classic', null);
    assert('V13.4-A · game normal cerrado sin pasar por deuce (4-0)', state.gamesA === 1, JSON.stringify(state));
    assert('V13.4-A · todavía no hay ningún game sensible cerrado: no bloqueado', !E.isScoringSystemLocked(events, 'golden', fmt, 'classic', null), '');
    // "Cambia" a Star Point (nada que reescribir: ningún game pasó por deuce todavía) y llega
    // a un game con Deuce que SÍ cierra bajo Star Point: 3-3, luego 4-3/4-4/5-4/5-5 (el Star
    // Point real) y por último 6-5 (regla especial de Star Point en la ventaja decisiva).
    ['A', 'A', 'A', 'B', 'B', 'B', 'A', 'B', 'A', 'B', 'A'].forEach((t, i) => events.push({ team: t, matchTimeMs: 1000 + i * 100 }));
    state = E.computeStateFromEvents(events, 'starpoint', fmt, 'classic', null);
    assert('V13.4-A · el segundo game cerró bajo Star Point (6-5)', state.gamesA === 2 && state.pointsA === 0 && state.pointsB === 0, JSON.stringify(state));
    assert('V13.4-A · ese game pasó por deuce: el sistema queda BLOQUEADO para el resto del partido', E.isScoringSystemLocked(events, 'starpoint', fmt, 'classic', null), '');
    // Evidencia de POR QUÉ hace falta el bloqueo: reinterpretar los mismos eventos bajo
    // Punto de Oro da un resultado DISTINTO (el punto decisivo llega antes) — un cambio a
    // esta altura sí reescribiría el partido, exactamente lo que V13.4 debe impedir.
    const hypoUnderGolden = E.computeStateFromEvents(events, 'golden', fmt, 'classic', null);
    assert('V13.4-A · reinterpretar bajo Punto de Oro da otro resultado (por eso no se puede permitir)', hypoUnderGolden.gamesA !== state.gamesA || hypoUnderGolden.pointsA !== state.pointsA || hypoUnderGolden.pointsB !== state.pointsB, JSON.stringify({ hypoUnderGolden, state }));
    // Metadata/stats consistentes con Star Point como único sistema del partido (§10).
    const statsA = S.computeStats(events, { players: makePlayers(), scoringSystem: 'starpoint', format: fmt, tiebreakMode: 'classic', serverKnowledge: null, baseline: null });
    assert('V13.4-A · Golden Points = 0 (nunca mezcla de reglas)', statsA.goldenPoints.played === 0, JSON.stringify(statsA.goldenPoints));
    assert('V13.4-A · Star Points según los hechos reales (> 0)', statsA.starPoints.played > 0, JSON.stringify(statsA.starPoints));
  })();

  // V13.4-B (§12) — corrección en 40-40: cambiar de Punto de Oro a Con Ventaja justo en el
  // primer 40-40 (antes de jugar el punto decisivo) es siempre seguro, y bloquea recién
  // cuando el game que pasó por esa zona termina cerrándose.
  (function () {
    const fmt = E.FORMATS.classic;
    const events = [];
    ['A', 'A', 'A', 'B', 'B', 'B'].forEach((t, i) => events.push({ team: t, matchTimeMs: i * 100 })); // 3-3, sin decidir
    let state = E.computeStateFromEvents(events, 'golden', fmt, 'classic', null);
    assert('V13.4-B · llega a 40-40 bajo Punto de Oro sin decidir el game', state.pointsA === 3 && state.pointsB === 3 && state.gamesA === 0, JSON.stringify(state));
    let gameSeq = E.extractCurrentGamePointSequence(events, 'golden', fmt, 'classic', null);
    let available = E.availableScoringSystems(gameSeq);
    assert('V13.4-B · en 40-40 los 3 sistemas siguen siendo compatibles', available.length === 3, JSON.stringify(available));
    // CAMBIAR → CON VENTAJA: el score sigue 40-40/Deuce, no se reescribe nada.
    state = E.computeStateFromEvents(events, 'classic', fmt, 'classic', null);
    assert('V13.4-B · tras cambiar, el score sigue 40-40 (Deuce), nada se reescribió', state.pointsA === 3 && state.pointsB === 3 && state.gamesA === 0, JSON.stringify(state));
    // Juega el punto que bajo Punto de Oro hubiera cerrado el game: bajo Con Ventaja debe
    // quedar VENTAJA, nunca cerrar el game solo.
    events.push({ team: 'A', matchTimeMs: 1000 });
    state = E.computeStateFromEvents(events, 'classic', fmt, 'classic', null);
    assert('V13.4-B · queda VENTAJA, no cierra el game (Con Ventaja pide diferencia de 2)', state.pointsA === 4 && state.pointsB === 3 && state.gamesA === 0, JSON.stringify(state));
    const disp = E.formatPointsDisplay(state.pointsA, state.pointsB, 'classic');
    assert('V13.4-B · el marcador muestra VENTAJA', disp.aText === 'VENTAJA', JSON.stringify(disp));
    assert('V13.4-B · todavía no bloqueado (el game sigue abierto)', !E.isScoringSystemLocked(events, 'classic', fmt, 'classic', null), '');
    // Finaliza el game (segunda ventaja consecutiva cierra bajo Con Ventaja).
    events.push({ team: 'A', matchTimeMs: 1500 });
    state = E.computeStateFromEvents(events, 'classic', fmt, 'classic', null);
    assert('V13.4-B · el game cierra 1-0', state.gamesA === 1, JSON.stringify(state));
    assert('V13.4-B · el sistema queda bloqueado en Con Ventaja para el resto del partido', E.isScoringSystemLocked(events, 'classic', fmt, 'classic', null), '');
  })();

  // V13.3 (§10/§21-A) — BENCHMARK NARRATIVO A: 6-4 · 6-3

  // ==================================================================
  // V13.3 (§11/§21-B) — BENCHMARK NARRATIVO B: 4-6 · 6-1 · 6-3
  // Set 1: A llega a estar 4-1 arriba, B remonta con 5 seguidos y cierra 4-6 (comeback de B).
  // Set 2: A se pone 3-0, B corta la racha para el 3-1 pero A gana los 3 siguientes (6-1) —
  // caso central de "contar también al equipo que pierde" (§6).
  // Set 3: parejo, A cierra 6-3 con margen (comfortable genérico, sin racha de apertura
  // interrumpida lo bastante larga como para narrarla aparte).
  // ==================================================================
  (function () {
    const ctx = newGamesCtx('classic');
    ['A', 'A', 'A', 'B', 'A', 'B', 'B', 'B', 'B', 'B'].forEach((t) => winGameEv(ctx, t)); // Set1: A llega 4-1, B gana 5 seguidos -> 4-6
    ['A', 'A', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGameEv(ctx, t)); // Set2: A 3-0, B corta a 3-1, A gana 3 seguidos -> 6-1
    ['A', 'B', 'A', 'B', 'A', 'A', 'B', 'A', 'A'].forEach((t) => winGameEv(ctx, t)); // Set3: parejo hasta 2-2, A cierra 6-3
    assert('V13.3-B · llega a 4-6 · 6-1 · 6-3, B gana Set1, A gana el partido', ctx.state.sets.length === 3 && ctx.state.sets[0].gamesA === 4 && ctx.state.sets[0].gamesB === 6 && ctx.state.sets[1].gamesA === 6 && ctx.state.sets[1].gamesB === 1 && ctx.state.sets[2].gamesA === 6 && ctx.state.sets[2].gamesB === 3 && ctx.state.matchWinner === 'A', JSON.stringify(ctx.state.sets));
    const text = gamesIntelFor(ctx);
    const paras = text.split('\n\n');
    assert('V13.3-B · Set 1 detecta la remontada de B desde 1-4 abajo (orientado a B)', /1-4/.test(paras[0]), paras[0]);
    assert('V13.3-B · Set 2 acredita a quien pierde cortando la racha ("cortaron la racha")', /cortaron la racha/i.test(paras[1]), paras[1]);
    assert('V13.3-B · Set 2 menciona el 3-0 de apertura y el 3-1 del corte', /3-0/.test(paras[1]) && /3-1/.test(paras[1]), paras[1]);

  // ==================================================================
  // V13.4 (§15/§21) — CASO REAL: una desventaja de 1 game explicada por el orden de saque
  // (nunca un quiebre) no debe narrarse como remontada/reacción. Gusti/Esteban (A) sacan
  // primero; ambos sostienen su saque hasta 4-4; recién ahí Seba/Matu (B) quiebran para 5-4
  // y sostienen para cerrar 6-4. El "3-4" que existió un instante (A arriba, antes de que B
  // sostenga su propio saque) es puro artefacto de rotación, no una racha real.
  // ==================================================================
  (function () {
    const ctx = newGamesCtx('americano');
    ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'B', 'B'].forEach((t) => winGameEv(ctx, t)); // 1-0,1-1,2-1,2-2,3-2,3-3,4-3,4-4,4-5(quiebre),4-6(hold)
    assert('V13.4-15 · el set cierra 6-4 para B', ctx.state.sets.length === 1 && ctx.state.sets[0].gamesA === 4 && ctx.state.sets[0].gamesB === 6, JSON.stringify(ctx.state.sets));

    // Verificación de bajo nivel: la racha de cierre efectiva arranca en el EMPATE real 4-4
    // (2 games: el quiebre + el hold), nunca en el "3-4" que precede al hold de B.
    const seq = S.walkGamesProgression(ctx.events, ctx.format, gamesMatchCtxFor(ctx), 1, 0);
    const holdOrBreaks = seq.slice(1).map((p) => p.holdOrBreak);
    assert('V13.4-15 · el sacador se resolvió para los 10 games (server info completa)', holdOrBreaks.every((x) => x === 'hold' || x === 'break'), JSON.stringify(holdOrBreaks));
    assert('V13.4-15 · el game que até 4-4 fue un HOLD de B (nunca un quiebre)', holdOrBreaks[7] === 'hold', JSON.stringify(holdOrBreaks));
    const progAnalysis = S.analyzeGamesSetProgression(seq, 'B');
    assert('V13.4-15 · la racha de cierre efectiva arranca en el empate real 4-4 (no en "3-4")', progAnalysis.runStartScore.a === 4 && progAnalysis.runStartScore.b === 4 && progAnalysis.closingStreak === 2, JSON.stringify(progAnalysis));
    const shape = S.classifyGamesSetShape(ctx.state.sets[0], progAnalysis, false, gamesStatsFor(ctx), ctx.format);
    assert('V13.4-15 · la forma es "tight" (parejo hasta el empate), nunca "comeback"', shape === 'tight', shape);

    // Verificación de extremo a extremo: el texto final no dice "abajo 3-4" ni "reaccionaron".
    const text = gamesIntelFor(ctx);
    assert('V13.4-15 · el texto describe el tramo como parejo hasta 4-4', /4-4/.test(text), text);
    assert('V13.4-15 · el texto NUNCA dice que B estuvo abajo (esa desventaja era artefacto de saque)', !/abajo/i.test(text), text);
    assert('V13.4-15 · el texto NUNCA narra esto como reacción/remontada', !/reaccion|remontad/i.test(text), text);
  })();

  // V13.3 (§12) — BUG REAL: estadísticas por set usaban siempre la rotación de saque del
  // Set 1 (el replay de un tramo aislado nunca sabía su número de set real). Invariantes
  // obligatorios: la suma de breaks/holds/games de cada set tiene que dar el total del
  // partido — en un partido de 3 sets donde el saque inicial alterna de forma distinta en
  // cada set (natural: la paridad de saque depende de cuántos games ya se jugaron).
  // ==================================================================
  (function () {

    ['B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'A'].forEach((t) => winGameEv(ctx, t)); // Set3 7-5 A

    const perSet = segs.map((seg) => S.computeGamesStats(seg.events, gamesMatchCtxFor(ctx), seg.setNumber, seg.startingGameIndex));
    const sum = (field) => perSet.reduce((acc, s) => acc + s[field], 0);
    assert('V13.3-stats · Breaks A: suma de sets = partido', sum('breaksA') === matchStats.breaksA, JSON.stringify({ perSet: perSet.map((s) => s.breaksA), total: matchStats.breaksA }));
    assert('V13.3-stats · Breaks B: suma de sets = partido', sum('breaksB') === matchStats.breaksB, JSON.stringify({ perSet: perSet.map((s) => s.breaksB), total: matchStats.breaksB }));
    assert('V13.3-stats · Holds A: suma de sets = partido', sum('holdsA') === matchStats.holdsA, JSON.stringify({ perSet: perSet.map((s) => s.holdsA), total: matchStats.holdsA }));
    assert('V13.3-stats · Holds B: suma de sets = partido', sum('holdsB') === matchStats.holdsB, JSON.stringify({ perSet: perSet.map((s) => s.holdsB), total: matchStats.holdsB }));
    assert('V13.3-stats · Games A: suma de sets = partido', sum('gamesA') === matchStats.gamesA, JSON.stringify({ perSet: perSet.map((s) => s.gamesA), total: matchStats.gamesA }));
    assert('V13.3-stats · Games B: suma de sets = partido', sum('gamesB') === matchStats.gamesB, JSON.stringify({ perSet: perSet.map((s) => s.gamesB), total: matchStats.gamesB }));
    const sgWonA = (s) => s.serviceGames.wonA + s.serviceGames.lostA;
    const sgWonB = (s) => s.serviceGames.wonB + s.serviceGames.lostB;

    assert('V13.3-stats · denominador de games de saque B: suma de sets = partido', perSet.reduce((acc, s) => acc + sgWonB(s), 0) === sgWonB(matchStats), '');
    // Sin el fix, el Set 3 (donde el saque inicial es distinto al del Set 1) hubiera
    // resuelto el sacador con la rotación equivocada — chequeo directo, no solo la suma.
    assert('V13.3-stats · el Set 3 no queda con todo el saque "unknown" (rotación resuelta con su propio número de set)', (perSet[2].serviceGames.wonA + perSet[2].serviceGames.wonB + perSet[2].serviceGames.lostA + perSet[2].serviceGames.lostB) === (perSet[2].gamesA + perSet[2].gamesB), JSON.stringify(perSet[2]));
  })();

  // ==================================================================
  // V14 (§10-13, §19 A-D) — CARGA MANUAL DE PARTIDOS: `computeManualStats` +
  // `generateManualIntelligence` solo pueden afirmar hechos derivables del resultado FINAL
  // por set (ganador, sets/games ganados, sets corridos, remontada A NIVEL DE SETS, set más
  // ajustado/de mayor margen, cierre del decisivo) — NUNCA breaks/holds/puntos/rachas de
  // game (§13: "si el dato no fue registrado, no existe"). Los casos E/F/G del consolidado
  // (hora vacía, geolocalización rechazada, Historial mixto) son DOM/app.js — fuera del
  // alcance de este arnés puro engine.js+stats.js, verificados a mano en el navegador
  // durante el desarrollo de V14.
  // ==================================================================
  function enumerateValidPairs(format) {
    const pairs = [];
    for (let a = 0; a <= format.setWinTarget + 1; a++) {
      for (let b = 0; b <= format.setWinTarget + 1; b++) {
        if (E.isValidCompletedSetScore(a, b, format)) pairs.push({ a, b });
      }
    }
    return pairs;
  }
  function manualSet(a, b, format) {
    const winner = a > b ? 'A' : 'B';
    let tiebreak = null;
    if (E.completedSetHasTiebreak(a, b, format)) {
      const cfg = E.tiebreakModeConfig('classic');
      tiebreak = winner === 'A' ? { a: cfg.winTarget, b: cfg.winTarget - 2, mode: 'classic' } : { a: cfg.winTarget - 2, b: cfg.winTarget, mode: 'classic' };
    }
    return { gamesA: a, gamesB: b, tiebreak, winner };
  }
  function manualCtxFor(pairs, formatId) {
    const format = E.FORMATS[formatId || 'classic'];
    const sets = pairs.map(([a, b]) => manualSet(a, b, format));
    const matchCtx = { players: makePlayers(), format };
    const need = Math.ceil(format.bestOfSets / 2);
    const setsWonA = sets.filter((s) => s.winner === 'A').length;
    const setsWonB = sets.filter((s) => s.winner === 'B').length;
    const winnerTeam = setsWonA >= need ? 'A' : (setsWonB >= need ? 'B' : null);
    const stats = S.computeManualStats(sets, matchCtx);
    const intelligence = S.generateManualIntelligence(stats, matchCtx, sets, winnerTeam, { manual: false });
    return { sets, matchCtx, stats, winnerTeam, intelligence };
  }
  const FORBIDDEN_MANUAL_WORDS = ['quiebre', 'break', 'hold', 'punto de oro', 'star point', 'racha', 'ventaja', 'deuce', 'saque'];
  function assertNoForbiddenWords(name, text) {
    const lower = text.toLowerCase();
    const found = FORBIDDEN_MANUAL_WORDS.filter((w) => lower.indexOf(w) !== -1);
    assert(name, found.length === 0, JSON.stringify({ found, text }));
  }

  // Caso A (§19-A) — Clásico 2 sets: 6-3 · 6-4, sin remontada.
  (function () {
    const r = manualCtxFor([[6, 3], [6, 4]], 'classic');
    assert('V14-A · ganador correcto (A)', r.winnerTeam === 'A');
    assert('V14-A · sets ganados 2-0', r.stats.setsWonA === 2 && r.stats.setsWonB === 0);
    assert('V14-A · games totales', r.stats.gamesA === 12 && r.stats.gamesB === 7);
    assert('V14-A · sets corridos', r.stats.straightSets === true);
    assert('V14-A · sin remontada', r.stats.comebackTeam === null);
    assertNoForbiddenWords('V14-A · Intelligence no inventa breaks/puntos/rachas', r.intelligence);
  })();

  // Caso B (§19-B) — Clásico 3 sets con remontada: perdió 4-6, ganó 6-3 y 7-5.
  (function () {

    assert('V14-B · ganador correcto (A)', r.winnerTeam === 'A');

  // ==================================================================
  // RAMA JUGADOR (Etapa 2) — player-home.js: filtrado por jugador, forma
  // reciente, mejor racha, compañero/rival frecuente, "Tu momento".
  // Funciones puras sin DOM — mismo criterio que el resto de este arnés.
  // ==================================================================
  function mkHistoryMatch(matchId, finishedAt, names, winnerTeam) {
    return {
      matchId, finishedAt, winnerTeam,
      players: [
        { id: 0, team: 'A', name: names[0] }, { id: 1, team: 'A', name: names[1] },
        { id: 2, team: 'B', name: names[2] }, { id: 3, team: 'B', name: names[3] },
      ],
      sets: [{ gamesA: 6, gamesB: 3, tiebreak: null, extraordinary: false }],
      currentPartial: null, mode: 'manual', timeZone: 'UTC',
    };
  }

  // Etapa 3 (Fase 1) — igual que mkHistoryMatch, pero con control total e independiente
  // sobre los 4 campos de fecha (playedAt/startedAt/finishedAt/createdAt), todos opcionales,
  // para poder simular registros históricos incompletos sin tocar el fixture existente.
  function mkDatedMatch(matchId, dates, names, winnerTeam) {
    return {
      matchId,
      playedAt: dates.playedAt || null,
      startedAt: dates.startedAt || null,
      finishedAt: dates.finishedAt || null,
      createdAt: dates.createdAt || null,
      winnerTeam,
      players: [
        { id: 0, team: 'A', name: names[0] }, { id: 1, team: 'A', name: names[1] },
        { id: 2, team: 'B', name: names[2] }, { id: 3, team: 'B', name: names[3] },
      ],
      sets: [{ gamesA: 6, gamesB: 3, tiebreak: null, extraordinary: false }],
      currentPartial: null, mode: 'manual', timeZone: 'UTC',
    };
  }

  (function () {

      mkHistoryMatch('m1', '2026-06-01T00:00:00.000Z', ['Sebastián', 'Martín', 'Cruz', 'Dan'], 'A'), // win
      mkHistoryMatch('m2', '2026-06-10T00:00:00.000Z', ['Sebastián', 'Martín', 'Ana', 'Bea'], 'B'), // loss
      mkHistoryMatch('m3', '2026-06-15T00:00:00.000Z', ['Sebastián', 'Lucas', 'Cruz', 'Dan'], 'A'), // win

  // ------------------------------------------------------------------
  function mkActiveMatchSnapshot(mode, events, names) {
    const match = {
      id: 'm_test',
      players: [
        { id: 0, team: 'A', name: names[0] }, { id: 1, team: 'A', name: names[1] },
        { id: 2, team: 'B', name: names[2] }, { id: 3, team: 'B', name: names[3] },
      ],
      mode, scoringSystem: 'golden', formatId: 'classic', tiebreakMode: 'classic', baseline: null,
    };
    const snap = { match, finished: false };
    if (mode === 'games') snap.gameEvents = events || []; else snap.pointEvents = events || [];
    return snap;
  }

  (function () {
    assert('Fase2 · registerModeLabel("games") = "Game por game"', PH.registerModeLabel('games') === 'Game por game');
    assert('Fase2 · registerModeLabel("complete") = "Punto por punto"', PH.registerModeLabel('complete') === 'Punto por punto');

    assert('Fase2 · summarizeActiveMatchSnapshot(null) = null', PH.summarizeActiveMatchSnapshot(null) === null);
    assert('Fase2 · summarizeActiveMatchSnapshot sin match = null', PH.summarizeActiveMatchSnapshot({ finished: false }) === null);

    const complete0 = mkActiveMatchSnapshot('complete', [], ['Sebastián', 'Martín', 'Cruz', 'Dan']);
    const summaryComplete = PH.summarizeActiveMatchSnapshot(complete0);
    assert('Fase2 · summarizeActiveMatchSnapshot (Completo) arma las parejas correctamente', summaryComplete.teamAName === 'Sebastián / Martín' && summaryComplete.teamBName === 'Cruz / Dan', JSON.stringify(summaryComplete));
    assert('Fase2 · summarizeActiveMatchSnapshot (Completo) usa el modo correcto', summaryComplete.modeLabel === 'Punto por punto');
    assert('Fase2 · summarizeActiveMatchSnapshot (Completo) arranca en 0-0 sin eventos', summaryComplete.scoreLabel === '0-0', summaryComplete.scoreLabel);

    const games0 = mkActiveMatchSnapshot('games', [], ['Ana', 'Bea', 'Cruz', 'Dan']);
    const summaryGames = PH.summarizeActiveMatchSnapshot(games0);
    assert('Fase2 · summarizeActiveMatchSnapshot (Por Games) usa el motor de games y el modo correcto', summaryGames.modeLabel === 'Game por game' && summaryGames.scoreLabel === '0-0', JSON.stringify(summaryGames));
  })();

  // ------------------------------------------------------------------
  // Correcciones postprueba de Fase 2 (§3.3) — resultado parcial COMPLETO: todos los sets
  // terminados + el set actual, nunca solo este último. `formatLiveScoreLabel` es pura y
  // opera directamente sobre `state` (mismo objeto que ya produce el motor real) — se prueba
  // tanto con estados construidos a mano (caso de tie break extraordinario, para no
  // reconstruir la mecánica completa de un TB solo para este test) como con progresión REAL
  // vía event-replay del motor en ambos modos (Completo y Por Games), sin ninguna lógica de
  // puntuación propia: son los mismos `computeStateFromEvents`/`computeGameStateFromEvents`
  // que ya usa el marcador en vivo.
  // ------------------------------------------------------------------
  function winCleanPointGames(team, numGames) {
    const events = [];
    for (let g = 0; g < numGames; g++) { for (let p = 0; p < 4; p++) events.push({ team }); } // 4 puntos limpios (Punto de Oro) cierran un game sin deuce
    return events;
  }
  function winCleanGameEvents(team, numGames) {
    const events = [];
    for (let g = 0; g < numGames; g++) events.push({ team });
    return events;
  }

  (function () {
    const fmt = E.FORMATS.classic;

    // Set 1 en curso (sin sets terminados todavía) — Punto por punto.
    const s1 = E.computeStateFromEvents(winCleanPointGames('A', 2), 'golden', fmt, 'classic', null);
    assert('Fase2-PP §3.3 · Completo, set 1 en curso (sin sets terminados)', PH.formatLiveScoreLabel(s1) === '2-0', PH.formatLiveScoreLabel(s1));

    // Set 2 con el primero terminado (6-0) — Punto por punto.
    const s2Events = winCleanPointGames('A', 6).concat(winCleanPointGames('B', 3));
    const s2 = E.computeStateFromEvents(s2Events, 'golden', fmt, 'classic', null);
    assert('Fase2-PP §3.3 · Completo, set 2 con el primero terminado', PH.formatLiveScoreLabel(s2) === '6-0 · 0-3', PH.formatLiveScoreLabel(s2));

    // Set 3 con dos sets terminados (6-0, 0-6) — Punto por punto.
    const s3Events = winCleanPointGames('A', 6).concat(winCleanPointGames('B', 6), winCleanPointGames('A', 2));
    const s3 = E.computeStateFromEvents(s3Events, 'golden', fmt, 'classic', null);
    assert('Fase2-PP §3.3 · Completo, set 3 con dos sets terminados', PH.formatLiveScoreLabel(s3) === '6-0 · 0-6 · 2-0', PH.formatLiveScoreLabel(s3));

    // Mismos tres casos en Por Games — mismo helper, mismo resultado esperado, motor distinto.
    const g1 = E.computeGameStateFromEvents(winCleanGameEvents('B', 3), fmt, null);
    assert('Fase2-PP §3.3 · Por Games, set 1 en curso (sin sets terminados)', PH.formatLiveScoreLabel(g1) === '0-3', PH.formatLiveScoreLabel(g1));

    const g2Events = winCleanGameEvents('A', 6).concat(winCleanGameEvents('B', 4));
    const g2 = E.computeGameStateFromEvents(g2Events, fmt, null);
    assert('Fase2-PP §3.3 · Por Games, set 2 con el primero terminado', PH.formatLiveScoreLabel(g2) === '6-0 · 0-4', PH.formatLiveScoreLabel(g2));

    const g3Events = winCleanGameEvents('A', 6).concat(winCleanGameEvents('B', 6), winCleanGameEvents('A', 1));
    const g3 = E.computeGameStateFromEvents(g3Events, fmt, null);
    assert('Fase2-PP §3.3 · Por Games, set 3 con dos sets terminados', PH.formatLiveScoreLabel(g3) === '6-0 · 0-6 · 1-0', PH.formatLiveScoreLabel(g3));

    // Tie break extraordinario ya decidido — MISMA regla que formatSetSegmentLabel (app.js):
    // un set extraordinario muestra su propio resultado de TB aparte; uno reglamentario (aunque
    // haya tenido tie break) muestra solo gamesA-gamesB. Estado construido a mano (misma forma
    // que ya produce el motor) para no reconstruir toda la mecánica de un TB extraordinario acá.
    const etbState = { sets: [{ gamesA: 4, gamesB: 4, tiebreak: { a: 10, b: 5, mode: 'classic' }, winner: 'A', extraordinary: true }], gamesA: 0, gamesB: 0 };
    assert('Fase2-PP §3.3 · set extraordinario muestra su propio resultado de TB', PH.formatLiveScoreLabel(etbState) === '4-4 · TB 10-5 · 0-0', PH.formatLiveScoreLabel(etbState));

    const regularTbState = { sets: [{ gamesA: 7, gamesB: 6, tiebreak: { a: 7, b: 5, mode: 'classic' }, winner: 'A' }], gamesA: 1, gamesB: 0 };
    assert('Fase2-PP §3.3 · set reglamentario con TB no repite el desglose (7-6 solo)', PH.formatLiveScoreLabel(regularTbState) === '7-6 · 1-0', PH.formatLiveScoreLabel(regularTbState));

    assert('Fase2-PP §3.3 · formatLiveScoreLabel es defensivo ante state null', PH.formatLiveScoreLabel(null) === '0-0');
  })();

    ];
    const best1 = PH.computeBestPartner(matches, player);
    assert('E4 · computeBestPartner ignora a quien no llega a la muestra mínima (Compa2, solo 2)', best1 && best1.name === 'Compa1' && best1.count === 3 && best1.wins === 2 && best1.pct === 67, JSON.stringify(best1));

    // Compa3 se suma con 4 juntos y 75% — mejor efectividad que Compa1 (67%), debe ganar.
    const withCompa3 = matches.concat([
      mkHistoryMatch('p6', '2026-06-06T00:00:00.000Z', [player, 'Compa3', 'X', 'Y'], 'A'),
      mkHistoryMatch('p7', '2026-06-07T00:00:00.000Z', [player, 'Compa3', 'X', 'Y'], 'A'),
      mkHistoryMatch('p8', '2026-06-08T00:00:00.000Z', [player, 'Compa3', 'X', 'Y'], 'A'),
      mkHistoryMatch('p9', '2026-06-09T00:00:00.000Z', [player, 'Compa3', 'X', 'Y'], 'B'),
    ]);
    const best2 = PH.computeBestPartner(withCompa3, player);
    assert('E4 · computeBestPartner elige la mayor efectividad, no la mayor cantidad', best2 && best2.name === 'Compa3' && best2.pct === 75, JSON.stringify(best2));

    // Empate de efectividad (ambos 100%, 3 juntos): gana quien tenga más partidos juntos.
    const tieByCount = [
      mkHistoryMatch('q1', '2026-06-01T00:00:00.000Z', [player, 'Uno', 'X', 'Y'], 'A'),
      mkHistoryMatch('q2', '2026-06-02T00:00:00.000Z', [player, 'Uno', 'X', 'Y'], 'A'),
      mkHistoryMatch('q3', '2026-06-03T00:00:00.000Z', [player, 'Uno', 'X', 'Y'], 'A'),
      mkHistoryMatch('q4', '2026-06-04T00:00:00.000Z', [player, 'Dos', 'X', 'Y'], 'A'),
      mkHistoryMatch('q5', '2026-06-05T00:00:00.000Z', [player, 'Dos', 'X', 'Y'], 'A'),
      mkHistoryMatch('q6', '2026-06-06T00:00:00.000Z', [player, 'Dos', 'X', 'Y'], 'A'),
      mkHistoryMatch('q7', '2026-06-07T00:00:00.000Z', [player, 'Dos', 'X', 'Y'], 'A'),
    ];
    const best3 = PH.computeBestPartner(tieByCount, player);
    assert('E4 · computeBestPartner desempata efectividad igual por más partidos juntos', best3 && best3.name === 'Dos' && best3.count === 4, JSON.stringify(best3));

    assert('E4 · computeBestPartner es null si nadie llega a la muestra mínima', PH.computeBestPartner([mkHistoryMatch('s1', '2026-06-01T00:00:00.000Z', [player, 'Solo', 'X', 'Y'], 'A')], player) === null);
  })();

  // ---- computeActivity30d / computeEffectiveness30d (ventana fija, sin depender de "ahora") ----
  (function () {
    const player = 'Sebastián';
    const now = new Date('2026-09-03T00:00:00.000Z');
    const nowMs = now.getTime();
    const matches = [
      mkDatedMatch('a1', { playedAt: daysAgoIso(nowMs, 1) }, [player, 'A', 'X', 'Y'], 'A'),  // muy reciente, victoria
      mkDatedMatch('a2', { playedAt: daysAgoIso(nowMs, 9) }, [player, 'A', 'X', 'Y'], 'B'),  // derrota
      mkDatedMatch('a3', { playedAt: daysAgoIso(nowMs, 16) }, [player, 'A', 'X', 'Y'], 'A'), // victoria
      mkDatedMatch('a4', { playedAt: daysAgoIso(nowMs, 25) }, [player, 'A', 'X', 'Y'], 'B'), // derrota, tramo más antiguo de la ventana
      mkDatedMatch('a5', { playedAt: daysAgoIso(nowMs, 31) }, [player, 'A', 'X', 'Y'], 'A'), // fuera de la ventana (>30 días) — no cuenta
      mkDatedMatch('a6', {}, [player, 'A', 'X', 'Y'], 'A'), // sin fecha real válida — no cuenta
    ];
    const activity = PH.computeActivity30d(matches, player, now);
    assert('E4 · computeActivity30d cuenta solo los partidos dentro de la ventana de 30 días con fecha válida', activity.total === 4, JSON.stringify(activity));
    assert('E4 · computeActivity30d ordena los 4 bloques del más antiguo al más reciente', activity.buckets.map((b) => b.count).join(',') === '1,1,1,1', JSON.stringify(activity.buckets));
    assert('E4 · computeActivity30d separa victorias/derrotas por bloque', activity.buckets[0].losses === 1 && activity.buckets[3].wins === 1, JSON.stringify(activity.buckets));

    const eff = PH.computeEffectiveness30d(matches, player, now);
    assert('E4 · computeEffectiveness30d considera solo partidos con resultado definido dentro de la ventana', eff.considered === 4 && eff.wins === 2 && eff.losses === 2 && eff.pct === 50, JSON.stringify(eff));

    const effEmpty = PH.computeEffectiveness30d([], player, now);
    assert('E4 · computeEffectiveness30d con historial vacío nunca inventa un porcentaje', effEmpty.considered === 0 && effEmpty.pct === null);
  })();

  // ---- computeThirtyDayPeriodCounts ----
  (function () {
    const player = 'Sebastián';
    const now = new Date('2026-09-03T00:00:00.000Z');
    const nowMs = now.getTime();
    const matches = [
      mkDatedMatch('per1', { playedAt: daysAgoIso(nowMs, 2) }, [player, 'A', 'X', 'Y'], 'A'),
      mkDatedMatch('per2', { playedAt: daysAgoIso(nowMs, 10) }, [player, 'A', 'X', 'Y'], 'A'),
      mkDatedMatch('per3', { playedAt: daysAgoIso(nowMs, 45) }, [player, 'A', 'X', 'Y'], 'A'),
      mkDatedMatch('per4', { playedAt: daysAgoIso(nowMs, -5) }, [player, 'A', 'X', 'Y'], 'A'), // fecha futura — nunca cuenta
    ];
    const periods = PH.computeThirtyDayPeriodCounts(matches, now);
    assert('E4 · computeThirtyDayPeriodCounts agrupa en períodos de 30 días sin solapar, ignora fechas futuras', periods.join(',') === '2,1', JSON.stringify(periods));
  })();

  // ---- computeHitos ----
  (function () {
    const player = 'Sebastián';
    assert('E4 · computeHitos no muestra nada con menos de 3 partidos', PH.computeHitos([mkHistoryMatch('h0', '2026-06-01T00:00:00.000Z', [player, 'A', 'X', 'Y'], 'A')], player).length === 0);

    // (a) a una victoria de igualar la mejor racha — cada partido con compañero distinto (no
    // dispara el hito de compañero) y sin fecha real (no dispara el de período más activo).
    const streakMatches = [
      mkHistoryMatch('ha1', '', [player, 'P1', 'X', 'Y'], 'A'),
      mkHistoryMatch('ha2', '', [player, 'P2', 'X', 'Y'], 'A'),
      mkHistoryMatch('ha3', '', [player, 'P3', 'X', 'Y'], 'B'),
      mkHistoryMatch('ha4', '', [player, 'P4', 'X', 'Y'], 'A'),
      mkHistoryMatch('ha5', '', [player, 'P5', 'X', 'Y'], 'A'),
      mkHistoryMatch('ha6', '', [player, 'P6', 'X', 'Y'], 'A'),
    ];
    const hitosA = PH.computeHitos(streakMatches, player);
    assert('E4 · computeHitos(a) reconoce estar a una victoria de igualar el récord', hitosA.indexOf('Una victoria más para igualar tu racha de 3.') !== -1, JSON.stringify(hitosA));

    // (b) buen momento con el compañero más frecuente — racha actual y mejor racha coinciden
    // (3 = 3), así que (a) NO dispara acá.
    const partnerMatches = [
      mkHistoryMatch('hb1', '', [player, 'Compa', 'X', 'Y'], 'A'),
      mkHistoryMatch('hb2', '', [player, 'Compa', 'X', 'Y'], 'A'),
      mkHistoryMatch('hb3', '', [player, 'Compa', 'X', 'Y'], 'A'),
      mkHistoryMatch('hb4', '', [player, 'Otro', 'X', 'Y'], 'B'),
    ];
    const hitosB = PH.computeHitos(partnerMatches, player);
    assert('E4 · computeHitos(b) reconoce buena forma reciente con el compañero más frecuente', hitosB.indexOf('Ganaste 3 de tus últimos 3 con Compa.') !== -1, JSON.stringify(hitosB));

    // (c) período más activo — sin victorias (racha actual y mejor racha en 0, nunca dispara
    // (a)) y con un compañero distinto por partido (nunca dispara (b)).
    const now = new Date();
    const nowMs = now.getTime();
    const activePeriodMatches = [
      mkDatedMatch('hc1', { playedAt: daysAgoIso(nowMs, 1) }, [player, 'Q1', 'X', 'Y'], 'B'),
      mkDatedMatch('hc2', { playedAt: daysAgoIso(nowMs, 5) }, [player, 'Q2', 'X', 'Y'], 'B'),
      mkDatedMatch('hc3', { playedAt: daysAgoIso(nowMs, 10) }, [player, 'Q3', 'X', 'Y'], 'B'),
      mkDatedMatch('hc4', { playedAt: daysAgoIso(nowMs, 45) }, [player, 'Q4', 'X', 'Y'], 'B'),
    ];
    const hitosC = PH.computeHitos(activePeriodMatches, player);
    assert('E4 · computeHitos(c) reconoce el período más activo cuando supera a todos los anteriores', hitosC.indexOf('Este es tu período más activo.') !== -1, JSON.stringify(hitosC));

    // Nunca más de 2 hitos a la vez.
    assert('E4 · computeHitos nunca devuelve más de 2', PH.computeHitos(streakMatches, player).length <= 2 && PH.computeHitos(partnerMatches, player).length <= 2 && hitosC.length <= 2);
  })();

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------
  const passCount = results.filter((r) => r.ok).length;
  const failCount = results.length - passCount;
  document.getElementById('summary').innerHTML =
    `${passCount}/${results.length} tests OK` + (failCount ? ` — <span class="bad">${failCount} FALLARON</span>` : ' — <span class="ok">todo verde</span>');
  document.getElementById('results').innerHTML = results.map((r) => `
    <div class="case ${r.ok ? 'pass' : 'fail'}">
      <div class="case__title">${r.ok ? '✅' : '❌'} ${r.name}</div>
      ${r.detail ? `<div class="case__detail">${String(r.detail).replace(/</g, '&lt;')}</div>` : ''}
    </div>
  `).join('');
})();
</script>
</body>
